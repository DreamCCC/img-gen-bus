<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080, FPS = 30;
const mk = (w, h) => Object.assign(document.createElement('canvas'), { width: w, height: h });
const OUT = document.getElementById('c');
const cv = OUT;
let ctx = cv.getContext('2d');
const bloomCv = mk(W / 2, H / 2), bctx = bloomCv.getContext('2d');
const tiny = mk(160, 90), tctx = tiny.getContext('2d');

// NBA 官方图文配色：gold 系列沿用旧键名，换成灰白，原场景的线条和描边自动变成 NBA 风格
const COL = {
  bg: '#0d0c0d', gold: '#c3ced3', goldHi: '#ffffff', goldDim: 'rgba(195,206,211,0.22)',
  white: '#ffffff', grey: '#9aa6ad', dark: '#231f20', red: '#c8102e', paper: '#f4f5f6', ink: '#231f20',
  blue: '#1d428a', blueHi: '#3a6bd1', light: '#d5d9dd',
};
const FONT_CN = '"NotoSansSC", sans-serif';
const FONT_UI = '"NotoSansSC", sans-serif';
const FONT_NUM = '"Action NBA Condensed", "DIN Condensed", sans-serif';
const FONT_NUMW = '"Action NBA", "Action NBA Condensed", sans-serif';
const FONT_KO = '"Knockout", "Action NBA Condensed", sans-serif';
const SKEW = -0.21;
let LOGO = null;

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeOut5 = (x) => 1 - Math.pow(1 - x, 5);
const easeIn = (x) => x * x * x;
const smooth = (x) => x * x * (3 - 2 * x);
const hash = (a, b = 0) => { const s = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453; return s - Math.floor(s); };
const pad = (k) => String(k).padStart(5, '0');
const fade = (t, a, b, fin = 0.3, fout = 0.3) => prog(t, a, a + fin) * (1 - prog(t, b - fout, b));
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

let TL, S, A, EV, MAN = {};
const GEN = {};
const GEN_NAMES = ['bj1979_bikes', 'forbidden_dawn', 'room1989', 'vhs_macro', 'hutong_hoop', 'school_court', 'streetlight_boy'];

// ---------- 图片加载与缓存 ----------
const imgCache = new Map();
function loadImg(src) {
  if (!imgCache.has(src)) {
    const im = new Image();
    im.src = src;
    imgCache.set(src, im.decode().then(() => im).catch(() => null));
    if (imgCache.size > 240) imgCache.delete(imgCache.keys().next().value);
  }
  return imgCache.get(src);
}
async function clip(name, lt) {
  const m = MAN[name];
  if (!m) return null;
  const k = clamp(Math.floor(lt * FPS + 1e-4), 0, m.n - 1);
  if (k + 1 < m.n) loadImg(`clips/${name}/${pad(k + 1)}.jpg`);
  return loadImg(`clips/${name}/${pad(k)}.jpg`);
}

// ---------- 预生成：颗粒、暗角、扫描线、光点 ----------
const grain = [];
{
  const r = mulberry32(7);
  for (let k = 0; k < 4; k++) {
    const g = mk(512, 512), gx = g.getContext('2d');
    const id = gx.createImageData(512, 512);
    for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 16; }
    gx.putImageData(id, 0, 0);
    grain.push(g);
  }
}
const vignette = mk(W, H);
{
  const v = vignette.getContext('2d');
  const g = v.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.0);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.75)');
  v.fillStyle = g; v.fillRect(0, 0, W, H);
}
const scan = mk(4, 4);
{ const s = scan.getContext('2d'); s.fillStyle = 'rgba(0,0,0,0.55)'; s.fillRect(0, 0, 4, 2); }
let scanPat;

const crowd = [];
{
  const r = mulberry32(11);
  while (crowd.length < 11000) {
    const a = r() * Math.PI * 2;
    const rr = lerp(0.36, 1, Math.sqrt(r()));
    if ((rr * 14) % 1 < 0.14) continue;
    const sector = (a / (Math.PI * 2)) * 18;
    if (Math.abs(sector - Math.round(sector)) < 0.06) continue;
    crowd.push({ a, rr, b: 0.35 + r() * 0.65, d: r(), i: crowd.length });
  }
}

// ---------- 通用绘制 ----------
function text(str, x, y, { size = 48, font = FONT_CN, weight = 'bold', color = COL.white, align = 'center', alpha = 1, spacing = 0, base = 'middle' } = {}) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = `${weight} ${size}px ${font}`;
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base;
  if (spacing) ctx.letterSpacing = `${spacing}px`;
  ctx.fillText(str, x, y);
  ctx.restore();
}
function strokeText(str, x, y, { size = 200, font = FONT_NUM, color = COL.gold, width = 2, alpha = 1, align = 'center', spacing = 0 } = {}) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha;
  ctx.font = `bold ${size}px ${font}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (spacing) ctx.letterSpacing = `${spacing}px`;
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.strokeText(str, x, y);
  ctx.restore();
}
function line(x0, y0, x1, y1, { color = COL.gold, width = 2, alpha = 1 } = {}) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.strokeStyle = color; ctx.lineWidth = width;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); ctx.restore();
}
function partialPolyline(pts, frac) {
  if (frac <= 0) return;
  let total = 0; const seg = [];
  for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(l); total += l; }
  let remain = total * clamp(frac);
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) {
    if (remain >= seg[i - 1]) { ctx.lineTo(pts[i][0], pts[i][1]); remain -= seg[i - 1]; }
    else { const f = remain / seg[i - 1]; ctx.lineTo(lerp(pts[i - 1][0], pts[i][0], f), lerp(pts[i - 1][1], pts[i][1], f)); break; }
  }
  ctx.stroke();
}
function arcPts(cx, cy, r, a0, a1, n = 64) {
  const p = [];
  for (let i = 0; i <= n; i++) { const a = lerp(a0, a1, i / n); p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  return p;
}
// 整屏铺满图片，s 为相对缩放，(fx, fy) 为画面中心在图上的位置（0..1）
function cover(im, { s = 1, fx = 0.5, fy = 0.5, alpha = 1, filter = 'none', x = 0, y = 0, w = W, h = H } = {}) {
  if (!im || alpha <= 0) return;
  const sc = Math.max(w / im.width, h / im.height) * s;
  const iw = im.width * sc, ih = im.height * sc;
  let dx = x + w / 2 - fx * iw, dy = y + h / 2 - fy * ih;
  dx = clamp(dx, x + w - iw, x); dy = clamp(dy, y + h - ih, y);
  ctx.save(); ctx.globalAlpha *= alpha; ctx.filter = filter;
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.drawImage(im, dx, dy, iw, ih);
  ctx.restore();
}
// 竖窗真人画面：两侧是同一画面的模糊放大，中间是清晰画面，金色边线
function blurBack(im, { alpha = 1, dark = 0.3, tint = null } = {}) {
  if (!im || alpha <= 0) return;
  tctx.filter = 'blur(3px)';
  const sc = Math.max(tiny.width / im.width, tiny.height / im.height) * 1.15;
  tctx.drawImage(im, (tiny.width - im.width * sc) / 2, (tiny.height - im.height * sc) / 2, im.width * sc, im.height * sc);
  tctx.filter = 'none';
  ctx.save(); ctx.globalAlpha *= alpha * dark; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(tiny, 0, 0, W, H);
  if (tint) { ctx.globalAlpha = alpha * 0.4; ctx.fillStyle = tint; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
}
function panel(im, { x = (W - 834) / 2, y = 0, w = 834, h = 1080, alpha = 1, back = true, dark = 0.3, frame = true, s = 1, fx = 0.5, fy = 0.5, filter = 'none' } = {}) {
  if (!im || alpha <= 0) return;
  if (back) blurBack(im, { alpha, dark });
  cover(im, { x, y, w, h, s, fx, fy, alpha, filter });
  if (frame) {
    ctx.save(); ctx.globalAlpha *= alpha * 0.75; ctx.strokeStyle = COL.gold; ctx.lineWidth = 2;
    if (h >= H) { ctx.beginPath(); ctx.moveTo(x - 1, 0); ctx.lineTo(x - 1, H); ctx.moveTo(x + w + 1, 0); ctx.lineTo(x + w + 1, H); ctx.stroke(); }
    else ctx.strokeRect(x - 1, y - 1, w + 2, h + 2);
    ctx.restore();
  }
}
function flash(a, color = '#fff8e8') {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = clamp(a); ctx.fillStyle = color; ctx.fillRect(0, 0, W, H); ctx.restore();
}
function black(a) { flash(a, '#000'); }
function decay(t, t0, tau) { return t >= t0 ? Math.exp(-(t - t0) / tau) : 0; }
function hitSum(t, list, tau) { let s = 0; for (const b of list) s += decay(t, b, tau); return s; }
function withZoom(z, cx, cy, fn) { ctx.save(); ctx.translate(cx, cy); ctx.scale(z, z); ctx.translate(-cx, -cy); const r = fn(); ctx.restore(); return r; }

// ---------- NBA 图文组件 ----------
function measure(s, { size = 48, font = FONT_UI, weight = 'bold', spacing = 0 } = {}) {
  ctx.save(); ctx.font = `${weight} ${size}px ${font}`; if (spacing) ctx.letterSpacing = `${spacing}px`;
  const w = ctx.measureText(s).width; ctx.restore(); return w;
}
function slab(x, y, w, h, color, skew = SKEW) {
  const k = h * skew / 2;
  ctx.beginPath();
  ctx.moveTo(x - k, y); ctx.lineTo(x + w - k, y); ctx.lineTo(x + w + k, y + h); ctx.lineTo(x + k, y + h);
  ctx.closePath(); ctx.fillStyle = color; ctx.fill();
}
// 英文小标：Knockout 全大写、字距 0.12em，后跟红色短线；返回文字宽度
function kicker(s, x, y, { size = 30, color = COL.white, alpha = 1, rule = 120, align = 'left' } = {}) {
  if (alpha <= 0) return 0;
  s = s.toUpperCase();
  const sp = size * 0.12, w = measure(s, { size, font: FONT_KO, weight: '', spacing: sp });
  const x0 = align === 'center' ? x - (w + (rule ? rule + 20 : 0)) / 2 : align === 'right' ? x - w : x;
  text(s, x0, y, { size, font: FONT_KO, weight: '', color, align: 'left', alpha, spacing: sp, base: 'alphabetic' });
  if (rule) { ctx.save(); ctx.globalAlpha *= alpha; ctx.fillStyle = COL.red; ctx.fillRect(x0 + w + 18, y - size * 0.4, rule, 4); ctx.restore(); }
  return w;
}
// 斜切色块花字：从左擦入（wipe）或砸入（slam），白色粗字跟进，右侧异色细条，上方可带 kicker
function huazi(t, t0, s, x, y, { size = 96, bg = COL.blue, fg = COL.white, font = FONT_KO, weight = '', kick = '', kc = COL.white, anim = 'wipe', align = 'left', hold = 99, out = 0.22, spacing = 0.04 } = {}) {
  const u = t - t0;
  if (u < 0 || u > hold + out) return;
  ctx.save();
  ctx.font = `${weight} ${size}px ${font}`; ctx.letterSpacing = `${size * spacing}px`;
  const tw = ctx.measureText(s).width;
  const padX = size * 0.4, h = size * 1.22, w = tw + padX * 2;
  const x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  const top = y - h / 2;
  ctx.translate(x0 + w / 2, y);
  if (anim === 'slam') { const sc = lerp(1.35, 1, easeOut(clamp(u / 0.12))); ctx.scale(sc, sc); }
  ctx.translate(-(x0 + w / 2), -y);
  const din = anim === 'slam' ? 1 : easeOut(clamp(u / 0.22));
  const dout = easeInOut(prog(u, hold, hold + out));
  const L = x0 - h, R = x0 + w + h;
  ctx.beginPath(); ctx.rect(lerp(L, R, dout), top - size * 1.2, (R - L) * (din - dout), h + size * 2.4); ctx.clip();
  ctx.globalAlpha = anim === 'slam' ? clamp(u / 0.05) : 1;
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
  slab(x0, top, w, h, bg); ctx.restore();
  slab(x0 + w - size * 0.16, top, size * 0.16, h, bg === COL.red ? COL.blue : COL.red);
  const tx = lerp(-size * 0.5, 0, easeOut(clamp((u - 0.05) / 0.25)));
  ctx.fillStyle = fg; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.fillText(s, x0 + padX + tx, y + size * 0.06);
  ctx.restore();
  if (kick) kicker(kick, x0 + 4, top - 18, { size: Math.max(26, size * 0.3), color: kc, alpha: clamp(u / 0.25) * (1 - dout) });
}
// 数据页背景：墨黑底 + 右下 NBA 蓝大圆 + 白色弧线 + 淡球场线
function courtBg(u, { alpha = 1, orb = true } = {}) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha;
  ctx.fillStyle = COL.ink; ctx.fillRect(0, 0, W, H);
  const d = easeOut(clamp(u / 0.8));
  if (orb) {
    ctx.fillStyle = COL.blue; ctx.beginPath(); ctx.arc(W + 900, H + 400, 1500, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 12;
    ctx.beginPath(); ctx.arc(W + 900, H + 400, 1530, Math.PI, Math.PI + 0.9 * d); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 10;
  ctx.beginPath(); ctx.arc(560, -380, 640, 0.15, Math.PI - 0.15); ctx.stroke();
  ctx.restore();
}
function cornerLogo(alpha = 0.92) {
  if (!LOGO || alpha <= 0) return;
  const lh = 96, lw = lh * LOGO.width / LOGO.height;
  ctx.save(); ctx.globalAlpha = alpha; ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 2;
  ctx.imageSmoothingQuality = 'high'; ctx.drawImage(LOGO, 56, 46, lw, lh); ctx.restore();
}

function drawCrowd(t, f, { alpha = 1, scale = 1, cx = 960, cy = 600, appear = null, pulse = 0, swirl = 0, collapse = 0, tone = null } = {}) {
  ctx.save();
  for (const p of crowd) {
    const ang = p.a + swirl * (1.4 - p.rr);
    const rr = p.rr * (1 - collapse);
    const x0 = Math.cos(ang) * rr, y0 = Math.sin(ang) * rr;
    const sx = cx + x0 * 900 * scale, sy = cy + y0 * 430 * scale;
    if (sx < -10 || sx > W + 10 || sy < -10 || sy > H + 10) continue;
    let a = alpha;
    if (appear !== null) a *= prog(appear, 0.9 * (p.rr - 0.36) + 0.5 * p.d, 0.25 + 0.9 * (p.rr - 0.36) + 0.5 * p.d);
    if (a <= 0) continue;
    const near = (y0 + 1) / 2;
    const size = lerp(1.2, 2.8, near) * scale;
    const fl = hash(p.i, f) < 0.0005;
    const br = clamp(p.b * (0.5 + 0.55 * pulse));
    ctx.globalAlpha = a * (fl ? 1 : lerp(0.35, 1, br) * lerp(0.55, 1, near));
    ctx.fillStyle = tone || (fl ? '#ffffff' : p.i % 9 === 0 ? '#e8334f' : p.i % 4 === 0 ? COL.blueHi : br > 0.8 ? COL.goldHi : COL.gold);
    const s = fl ? size * 2.2 : size;
    ctx.fillRect(sx - s / 2, sy - s / 2, s, s);
  }
  ctx.restore();
}
function flapDigit(x, y, d, land, t, { w = 120, h = 170, size = 150, seed = 0, color = null } = {}) {
  ctx.fillStyle = COL.blue; ctx.fillRect(x - w / 2, y - h / 2, w, h);
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2; ctx.strokeRect(x - w / 2, y - h / 2, w, h);
  let shown = d, sy = 1;
  if (t < land) { const step = Math.floor(t * 30); shown = Math.floor(hash(seed, step) * 10); sy = 1 - 0.5 * ((t * 30) % 1); }
  const bounce = t >= land ? 1 + 0.12 * Math.exp(-(t - land) / 0.06) : 1;
  ctx.save(); ctx.translate(x, y); ctx.scale(bounce, sy * bounce);
  text(String(shown), 0, size * 0.04, { size, font: FONT_NUMW, color: color || (t >= land ? COL.white : COL.light) });
  ctx.restore();
  ctx.fillStyle = COL.ink; ctx.fillRect(x - w / 2, y - 1.5, w, 3);
}
function nearestBeat(t, grid) { let b = grid[0]; for (const g of grid) if (Math.abs(g - t) < Math.abs(b - t)) b = g; return b; }
function goldBall(x, y, r, { alpha = 1, rot = 0, fill = COL.blue } = {}) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.rotate(rot);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = COL.goldHi; ctx.lineWidth = Math.max(2, r * 0.06); ctx.stroke();
  ctx.lineWidth = Math.max(1.5, r * 0.04);
  ctx.beginPath(); ctx.moveTo(-r, 0); ctx.lineTo(r, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(0, r); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(-r * 0.95, 0, r * 0.55, r * 0.9, 0, -Math.PI / 2, Math.PI / 2); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(r * 0.95, 0, r * 0.55, r * 0.9, 0, Math.PI / 2, Math.PI * 1.5); ctx.stroke();
  ctx.restore();
}
// 弹跳：落地时刻列表 → 当前高度（0 = 地面）
function bounceHeight(t, hits, h0) {
  if (t < hits[0]) { const k = prog(t, hits[0] - Math.sqrt(1), hits[0]); return h0 * (1 - k * k); }
  for (let i = 0; i < hits.length - 1; i++) {
    if (t < hits[i + 1]) { const a = hits[i], b = hits[i + 1], u = (t - a) / (b - a); const peak = h0 * Math.pow((b - a) / (hits[1] - hits[0]), 2) * 0.55; return 4 * peak * u * (1 - u); }
  }
  return 0;
}

// ================= 冷开场 =================
async function sc_open(t, f) {
  const [a, b] = S.open;
  const lt = t - a;
  const hits = EV.openBounces;
  // 一颗球落下弹起
  const ballA = 1 - prog(lt, 3.3, 4.2);
  if (ballA > 0) {
    const h = bounceHeight(lt, hits, 620);
    const r = 46;
    const fy = 760;
    const by = fy - r - h;
    const squash = hitSum(lt, hits, 0.05) * 0.18;
    ctx.save(); ctx.globalAlpha = ballA;
    // 地面光
    for (const hit of hits) {
      const k = lt - hit; if (k < 0 || k > 0.9) continue;
      ctx.beginPath(); ctx.ellipse(960, fy, 60 + k * 900, 8 + k * 60, 0, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(120,160,240,${(1 - k / 0.9) * 0.7})`; ctx.lineWidth = 2; ctx.stroke();
    }
    line(560, fy, 1360, fy, { color: COL.goldDim, width: 2 });
    ctx.translate(960, by + r); ctx.scale(1 + squash, 1 - squash); ctx.translate(-960, -(by + r));
    goldBall(960, by, r, { rot: lt * 2.2 });
    ctx.restore();
  }
  {
    const ka = fade(lt, 1.0, 3.6, 0.5, 0.4);
    kicker('NBA China Games', 960, 300, { size: 40, align: 'center', alpha: ka, rule: 0 });
    ctx.save(); ctx.globalAlpha = ka; ctx.fillStyle = COL.red; ctx.fillRect(960 - 60 * easeOut(prog(lt, 1.2, 1.8)), 324, 120 * easeOut(prog(lt, 1.2, 1.8)), 4); ctx.restore();
  }
  // 光点汇成看台（球变成中央一点）
  const appear = prog(lt, 3.6, 7.6) * 1.9;
  const rw = lt - 9.6;
  const swirl = rw > 0 ? -easeIn(prog(rw, 0, 4.68)) * 9 : 0;
  const collapse = easeIn(prog(lt, 13.75, 14.28));
  const desat = prog(lt, 9.8, 12.0);
  if (lt > 3.4) {
    const pulse = 0.6 + 0.6 * prog(lt, 5.6, 7.3) - 0.4 * desat;
    drawCrowd(t, f, { appear, pulse, swirl, collapse, cy: 560, tone: desat > 0.5 ? '#7f8a90' : null, alpha: 1 - 0.35 * desat });
    ctx.save(); ctx.globalAlpha = prog(lt, 3.6, 4.4) * (1 - collapse); ctx.strokeStyle = COL.gold; ctx.lineWidth = 2;
    ctx.translate(960, 560); ctx.rotate(swirl * 0.3);
    ctx.strokeRect(-200, -100, 400, 200);
    ctx.beginPath(); ctx.moveTo(0, -100); ctx.lineTo(0, 100); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
    goldBall(960, 560, lerp(46, 9, easeInOut(prog(lt, 3.4, 4.4))), { alpha: 1 - collapse });
  }
  // 年份倒退 2026 → 1979
  if (lt >= EV.rewind[0] - a - 0.2) {
    const [r0, r1] = EV.rewind;
    const u = prog(t, r0, r1);
    const year = Math.round(2026 - 47 * (1 - Math.pow(1 - u, 2.6)));

// ================= 1979：地球与航线 =================
const DC = [38.9, -77.0], BJ = [39.9, 116.4];
const rad = (d) => (d * Math.PI) / 180;
function slerpLatLon(p, q, u) {
  const v = ([la, lo]) => [Math.cos(rad(la)) * Math.cos(rad(lo)), Math.cos(rad(la)) * Math.sin(rad(lo)), Math.sin(rad(la))];
  const a = v(p), b = v(q);
  const dot = a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const om = Math.acos(dot);
  const s0 = Math.sin((1 - u) * om) / Math.sin(om), s1 = Math.sin(u * om) / Math.sin(om);
  const c = [a[0] * s0 + b[0] * s1, a[1] * s0 + b[1] * s1, a[2] * s0 + b[2] * s1];
  return [Math.asin(c[2]) * 180 / Math.PI, Math.atan2(c[1], c[0]) * 180 / Math.PI];
}
function proj([la, lo], [la0, lo0], R, cx, cy, lift = 0) {
  const f = rad(la), l = rad(lo), f0 = rad(la0), l0 = rad(lo0);
  const cosc = Math.sin(f0) * Math.sin(f) + Math.cos(f0) * Math.cos(f) * Math.cos(l - l0);
  const r = R * (1 + lift);
  return [cx + r * Math.cos(f) * Math.sin(l - l0), cy - r * (Math.cos(f0) * Math.sin(f) - Math.sin(f0) * Math.cos(f) * Math.cos(l - l0)), cosc];
}

function crt(im, x, y, w, h, { on = 1, alpha = 1, bezel = true, glow = 0.15 } = {}) {

  if (bezel) { ctx.fillStyle = '#121318'; ctx.beginPath(); ctx.roundRect(x - w * 0.06, y - h * 0.08, w * 1.12, h * 1.16, w * 0.05); ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 2; ctx.stroke(); }
  ctx.beginPath(); ctx.roundRect(x, y, w, h, w * 0.06); ctx.clip();
  ctx.fillStyle = '#000'; ctx.fillRect(x, y, w, h);

    ctx.save(); ctx.translate(x + w / 2, y + h / 2); ctx.scale(1, sy); ctx.translate(-(x + w / 2), -(y + h / 2));

    }
  } else if (pg.year === 2015) {

  } else {

  }
  flipBoard(pg, t);
  ctx.restore();
  kicker('17 teams · 28 games', 1840, 96, { size: 30, align: 'right', rule: 0, color: COL.light });
  flash(kick * (0.12 + 0.25 * intensity) + decay(t, A.lastHit, 0.1) * 0.5);
}

// ================= 灯灭 =================
async function sc_lightsout(t, f) {
  const [a, b] = S.lightsout;
  const lt = t - a;
  const rows = EV.lightsRows;
  const last = rows[rows.length - 1];
  const P = TL.flips; const pg = P[P.length - 1];
  const boardDim = 1 - 0.75 * prog(t, rows[0], last) - 0.25 * prog(t, last + 0.4, last + 1.4);
  // 顶灯：8 排，由远及近熄灭
  for (let r = 0; r < rows.length; r++) {
    const on = t < rows[r] ? 1 : decay(t, rows[r], 0.05) * 0.6;
    const yy = lerp(70, 300, r / (rows.length - 1)), n = 9 + r, sz = lerp(6, 16, r / (rows.length - 1));
    for (let k = 0; k < n; k++) {
      const xx = 960 + (k - (n - 1) / 2) * lerp(120, 200, r / (rows.length - 1));
      ctx.save(); ctx.globalAlpha = 0.15 + 0.85 * on;
      ctx.fillStyle = on > 0.3 ? COL.goldHi : '#3a3a40';
      ctx.beginPath(); ctx.ellipse(xx, yy, sz * 2, sz * 0.7, 0, 0, Math.PI * 2); ctx.fill();
      if (on > 0.3) { const g = ctx.createRadialGradient(xx, yy, 0, xx, yy, sz * 8); g.addColorStop(0, 'rgba(235,242,255,0.25)'); g.addColorStop(1, 'rgba(235,242,255,0)'); ctx.fillStyle = g; ctx.fillRect(xx - sz * 8, yy - sz * 8, sz * 16, sz * 16); }
      ctx.restore();
    }
  }
  flipBoard(pg, Math.max(t, pg.t + 1), { dim: boardDim });
  black(prog(t, last + 1.4, b - 0.2));
}

// ================= 2190 天 =================
async function sc_counter(t, f) {
  const [a, b] = S.counter;

  const n = Math.round(2190 * easeInOut(prog(t, c0, c1)));

// ================= 冷色空镜 + 心跳 =================
async function sc_cold(t, f) {
  const [a, b] = S.cold;
  const lt = t - a, d = b - a;
  const beat = hitSum(t, EV.hearts, 0.12);
  const seq = [['hutong_hoop', 0, 3.5, 'wan_hutong'], ['school_court', 3.4, 6.9, 'wan_school'], ['streetlight_boy', 6.8, d, 'wan_boy']];
  for (const [nm, s0, s1, wan] of seq) {
    const al = prog(lt, s0, s0 + 0.4) * (s1 < d ? 1 - prog(lt, s1 - 0.1, s1 + 0.3) : 1);
    if (al <= 0) continue;
    const im = MAN[wan] ? await clip(wan, lt - s0) : GEN[nm];
    cover(im, { s: lerp(1.03, MAN[wan] ? 1.05 : 1.12, prog(lt, s0, s1)) * (1 + 0.012 * beat), fx: 0.5, fy: 0.5, alpha: al, filter: `saturate(${0.35 + 0.15 * beat}) brightness(${0.78 + 0.1 * beat}) contrast(1.1) hue-rotate(-8deg)` });
  }
  filmGate(t, f, 0.4);
  black(1 - prog(lt, 0, 0.8));
  black(prog(lt, d - 0.25, d) * 0.9);
}

// ================= 2025 澳门：回归 =================
async function sc_macau(t, f) {
  const [a, b] = S.macau;
  const lt = t - a, d = b - a;
  const boom = A.boom;
  if (t < boom) {
    const im = await clip('mac_cg', lt);
    const u = prog(t, a, boom);
    panel(im, { s: 1.02 + 0.05 * u, filter: `saturate(${0.3 + 0.5 * u}) brightness(${0.7 + 0.25 * u})`, dark: 0.18, alpha: prog(lt, 0, 0.4) });
    drawCrowd(t, f, { alpha: 0.25 + 0.4 * u, pulse: 0.2 + 0.4 * u, tone: '#6f7480', appear: null, scale: 1.25, cy: 540 });
  } else {
    const k = t - boom;
    const names = ['mac_a', 'mac_b', 'mac_c'];
    const ims = await Promise.all(names.map((n) => clip(n, k)));
    const pw = 600, gap = 20, x0 = (W - 3 * pw - 2 * gap) / 2;
    blurBack(ims[1], { dark: 0.25 });
    ims.forEach((im, i) => {
      const slide = easeOut5(prog(k, i * 0.07, 0.45 + i * 0.07));
      panel(im, { x: x0 + i * (pw + gap), y: lerp(i % 2 ? -80 : 80, 0, slide), w: pw, h: H, back: false, alpha: slide, s: 1.06 + 0.06 * decay(k, 0, 0.3) });
    });
    const burst = k;
    if (burst < 1.2) {
      for (let i = 0; i < 260; i++) {
        const an = hash(i, 9) * Math.PI * 2, sp = 300 + hash(i, 10) * 1500;
        const x = 960 + Math.cos(an) * sp * burst, y = 540 + Math.sin(an) * sp * burst * 0.6;
        ctx.globalAlpha = 1 - burst / 1.2; ctx.fillStyle = hash(i, 12) > 0.5 ? COL.goldHi : '#fff'; ctx.fillRect(x - 2, y - 2, 4, 4);
      }
      ctx.globalAlpha = 1;
    }
    const ta = prog(k, 0.15, 0.3) * (1 - prog(k, 2.6, 3.1));
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    strokeText('2025', 960, 520, { size: 360, color: COL.goldHi, width: 4, alpha: ta });
    ctx.restore();
    if (ta > 0) huazi(t, boom + 0.15, 'MACAU', 960, 770, { size: 80, bg: COL.red, align: 'center', anim: 'slam', kick: 'NBA China Games are back', hold: 2.6 - 0.15, out: 0.3 });
    flash(decay(t, boom, 0.18));
  }
  black(1 - prog(lt, 0, 0.3));
}

async function sc_roster(t, f) {
  const cuts = EV.rosterCuts;

    }

    ctx.fillStyle = '#0b2e5c'; ctx.fillRect(W - lerp(0, 960, sl), 0, 960, H);
    text('ROCKETS', 480, 500, { size: 170, font: FONT_KO, weight: '', color: COL.white, alpha: sl, spacing: 4 });
    text('HOUSTON', 480, 630, { size: 44, font: FONT_KO, weight: '', color: 'rgba(255,255,255,0.8)', spacing: 10, alpha: sl });
    text('MAVERICKS', 1440, 500, { size: 150, font: FONT_KO, weight: '', color: COL.white, alpha: sl, spacing: 4 });
    text('DALLAS', 1440, 630, { size: 44, font: FONT_KO, weight: '', color: 'rgba(255,255,255,0.8)', spacing: 10, alpha: sl });
    const vs = decay(t, cuts[9], 0.2);
    text('VS', 960, 540, { size: 180 * (1 + 0.3 * vs), font: FONT_NUMW, color: COL.white, alpha: prog(t, cuts[9] - 0.05, cuts[9]) });
    kicker('NBA China Games 2026 · Macau', 960, 870, { size: 44, align: 'center', rule: 0, alpha: prog(t, cuts[9], cuts[9] + 0.2) });
  } else {
    const yr = name.slice(1);
    const bg = { '1979': GEN.bj1979_bikes, '2004': null, '2026': null }[yr];
    if (yr === '1979') cover(bg, { s: 1.1 + 0.05 * lt, filter: 'sepia(0.5) contrast(1.1) brightness(0.7)' });
    if (yr === '2004') { const im = await clip('dunk', 2.83); if (im) cover(im, { s: 1.08 + 0.05 * lt, filter: 'brightness(0.7)' }); }
    if (yr === '2026') drawCrowd(t, f, { pulse: 1.2, scale: 1.1 });
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    strokeText(yr, 960, 540, { size: 380 * (1 + 0.15 * kick), color: COL.goldHi, width: 4 });
    ctx.restore();
  }
  flash(kick * 0.35);
}

// ================= 四十七年，球一直在跳 =================
async function sc_finale(t, f) {
  const [a, b] = S.finale;
  const lt = t - a, d = b - a;
  const hits = EV.endBounces;
  const blendA = 1 - prog(t, hits[0] - 0.6, hits[0]);
  if (blendA > 0) {
    drawCrowd(t, f, { pulse: 0.8, alpha: blendA * 0.8, scale: lerp(1.3, 0.9, lt / d) });
    const im = await clip('dunk', 2.83);
    cover(im, { s: 1.15, alpha: blendA * 0.35, filter: 'grayscale(0.6)' });
    cover(GEN.bj1979_bikes, { s: 1.15, alpha: blendA * 0.25, filter: 'sepia(0.7)' });
  }
  text('47', 960, 460, { size: 380, font: FONT_NUMW, color: COL.white, alpha: fade(lt, 0.15, hits[0] - a, 0.3, 0.4) });
  kicker('years', 960, 680, { size: 64, align: 'center', rule: 0, color: COL.light, alpha: fade(lt, 0.4, hits[0] - a, 0.3, 0.4) });
  // 一颗球落下：首尾呼应
  if (t > hits[0] - 1.0) {
    const h = bounceHeight(t, hits, 560);
    const fy = 760, r = 46;
    line(560, fy, 1360, fy, { color: COL.goldDim, width: 2, alpha: prog(t, hits[0] - 1, hits[0] - 0.6) });
    for (const hit of hits) { const k = t - hit; if (k < 0 || k > 0.9) continue; ctx.beginPath(); ctx.ellipse(960, fy, 60 + k * 900, 8 + k * 60, 0, 0, Math.PI * 2); ctx.strokeStyle = `rgba(120,160,240,${(1 - k / 0.9) * 0.6})`; ctx.lineWidth = 2; ctx.stroke(); }
    goldBall(960, fy - r - h, r, { rot: t * 2.2, alpha: prog(t, hits[0] - 1, hits[0] - 0.7) });
  }
}

// ================= 片尾 =================
async function sc_end(t, f) {
  const [a, b] = S.end;

}

// ---------- 字幕 ----------
const NOSUB = new Set(['L18']);
function subtitles(t) {
  for (const v of TL.vo) {
    if (NOSUB.has(v.id)) continue;
    const a = v.t, b = v.t + v.dur + 0.25;
    const al = prog(t, a, a + 0.12) * (1 - prog(t, b - 0.15, b));
    if (al <= 0) continue;
    for (const [i, s] of wrapSub(v.text).entries()) subLine(s, 980 - (wrapSub(v.text).length - 1 - i) * 62, al);
  }
}
// 英文字幕：超过 1400px 在最接近中间的空格处折成两行
function wrapSub(s) {
  ctx.save(); ctx.font = `700 46px ${FONT_UI}`;
  const fits = ctx.measureText(s).width <= 1400;
  ctx.restore();
  if (fits) return [s];
  let best = -1;
  for (let i = 0; i < s.length; i++) if (s[i] === ' ' && (best < 0 || Math.abs(i - s.length / 2) < Math.abs(best - s.length / 2))) best = i;
  return best < 0 ? [s] : [s.slice(0, best), s.slice(best + 1)];
}
function subLine(s, y, al) {
  ctx.save(); ctx.globalAlpha = al;
  ctx.font = `700 46px ${FONT_UI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(0,0,0,0.85)';
  ctx.shadowColor = 'rgba(0,0,0,0.75)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
  ctx.strokeText(s, 960, y); ctx.shadowColor = 'transparent';
  ctx.fillStyle = COL.white; ctx.fillText(s, 960, y);
  ctx.restore();
}

// ---------- 主函数 ----------
const SCENES = {
  open: sc_open, map: sc_map, bj1979: sc_bj1979, ruler: sc_ruler, paper: sc_paper, room: sc_room, vhs: sc_vhs,
  tvwall: sc_tvwall, yao: sc_yao, ticket: sc_ticket, crowd: sc_crowd, board: sc_board, dunk: sc_dunk, score: sc_score,
  span: sc_span, flip: sc_flip, lightsout: sc_lightsout, counter: sc_counter, cold: sc_cold, macau: sc_macau,
  macau2: sc_macau2, rockets: sc_rockets, roster: sc_roster, finale: sc_finale, end: sc_end,
};
const NO_BLOOM = new Set(['dunk']);
async function renderH(t) {
  const f = Math.round(t * FPS);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, W, H);
  let cur = null;
  for (const [name, [a, b]] of Object.entries(S)) {
    const start = name === 'roster' ? EV.rosterCuts[0] : a;
    if (t >= start && t < b) { cur = name; break; }
  }
  if (cur === 'rockets' && t >= EV.rosterCuts[0]) cur = 'roster';
  if (cur) { ctx.save(); await SCENES[cur](t, f); ctx.restore(); }
  ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.globalCompositeOperation = 'source-over';
  if (!NO_BLOOM.has(cur)) {
    bctx.clearRect(0, 0, W / 2, H / 2);
    bctx.filter = 'blur(9px)'; bctx.drawImage(cv, 0, 0, W / 2, H / 2); bctx.filter = 'none';
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.3; ctx.drawImage(bloomCv, 0, 0, W, H); ctx.restore();
  }
  const g = grain[f % 4], ox = -Math.floor(hash(f, 21) * 512), oy = -Math.floor(hash(f, 22) * 512);
  for (let x = ox; x < W; x += 512) for (let y = oy; y < H; y += 512) ctx.drawImage(g, x, y);
  ctx.globalAlpha = 0.7; ctx.drawImage(vignette, 0, 0); ctx.globalAlpha = 1;
  subtitles(t);
  cornerLogo(cur === 'end' ? 0.92 * (1 - prog(t, S.end[0] + 1.2, S.end[0] + 1.8)) : 0.92);
}

window.renderFrame = renderH;

window.ready = (async () => {
  TL = await (await fetch('film_h_en.json')).json();

  if (!MAN.dunk) MAN.dunk = { n: 132 };

  LOGO = await loadImg('../assets/brand/logoman.png');
  window.DURATION = TL.duration;
  window.FPS = FPS;
  const noto = new FontFace('NotoSansSC', 'url(../assets/fonts/NotoSansSC.ttf)', { weight: '100 900' });
  document.fonts.add(await noto.load());
  await Promise.all([
    ...[500, 700, 900].map((w) => document.fonts.load(`${w} 100px ${FONT_UI}`, 'Abc')),
    document.fonts.load(`bold 100px ${FONT_NUM}`), document.fonts.load(`bold 100px ${FONT_NUMW}`), document.fonts.load(`100px ${FONT_KO}`),
  ]);
})();
