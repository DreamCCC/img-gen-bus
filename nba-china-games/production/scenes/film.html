<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080, FPS = 30;
const VMODE = new URLSearchParams(location.search).get('v') === '1';
const mk = (w, h) => Object.assign(document.createElement('canvas'), { width: w, height: h });
const OUT = document.getElementById('c');
if (VMODE) { OUT.width = 1080; OUT.height = 1920; }
// 竖版模式下横版画面先画到离屏的 cv 上，再由 renderV 重新构图到 OUT
const cv = VMODE ? mk(W, H) : OUT;
let ctx = cv.getContext('2d');
const vctx = OUT.getContext('2d');
const bloomCv = mk(W / 2, H / 2), bctx = bloomCv.getContext('2d');
const tiny = mk(160, 90), tctx = tiny.getContext('2d');

const COL = {
  bg: '#05060a', gold: '#d8b46a', goldHi: '#ffe2a0', goldDim: 'rgba(216,180,106,0.22)',
  white: '#f4efe6', grey: '#7d8590', dark: '#0b0c11', red: '#c8202f', paper: '#e8dfca', ink: '#2a2116',
};
const FONT_CN = '"Songti SC", "STSong", serif';
const FONT_UI = '"PingFang SC", sans-serif';
const FONT_NUM = '"DIN Condensed", "Helvetica Neue", sans-serif';

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeOut5 = (x) => 1 - Math.pow(1 - x, 5);
const easeIn = (x) => x * x * x;
const smooth = (x) => x * x * (3 - 2 * x);
const hash = (a, b = 0) => { const s = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453; return s - Math.floor(s); };
const pad = (k) => String(k).padStart(5, '0');
const fade = (t, a, b, fin = 0.3, fout = 0.3) => prog(t, a, a + fin) * (1 - prog(t, b - fout, b));
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

let TL, S, A, EV, MAN = {};
const GEN = {};
const GEN_NAMES = ['bj1979_bikes', 'forbidden_dawn', 'room1989', 'vhs_macro', 'hutong_hoop', 'school_court', 'streetlight_boy'];

// ---------- 图片加载与缓存 ----------
const imgCache = new Map();
function loadImg(src) {
  if (!imgCache.has(src)) {
    const im = new Image();
    im.src = src;
    imgCache.set(src, im.decode().then(() => im).catch(() => null));
    if (imgCache.size > 240) imgCache.delete(imgCache.keys().next().value);
  }
  return imgCache.get(src);
}
async function clip(name, lt) {
  const m = MAN[name];
  if (!m) return null;
  const k = clamp(Math.floor(lt * FPS + 1e-4), 0, m.n - 1);
  if (k + 1 < m.n) loadImg(`clips/${name}/${pad(k + 1)}.jpg`);
  return loadImg(`clips/${name}/${pad(k)}.jpg`);
}

// ---------- 预生成：颗粒、暗角、扫描线、光点 ----------
const grain = [];
{
  const r = mulberry32(7);
  for (let k = 0; k < 4; k++) {
    const g = mk(512, 512), gx = g.getContext('2d');
    const id = gx.createImageData(512, 512);
    for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 16; }
    gx.putImageData(id, 0, 0);
    grain.push(g);
  }
}
const vignette = mk(W, H);
{
  const v = vignette.getContext('2d');
  const g = v.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.0);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.75)');
  v.fillStyle = g; v.fillRect(0, 0, W, H);
}
const scan = mk(4, 4);
{ const s = scan.getContext('2d'); s.fillStyle = 'rgba(0,0,0,0.55)'; s.fillRect(0, 0, 4, 2); }
let scanPat;

const crowd = [];
{
  const r = mulberry32(11);
  while (crowd.length < 11000) {
    const a = r() * Math.PI * 2;
    const rr = lerp(0.36, 1, Math.sqrt(r()));
    if ((rr * 14) % 1 < 0.14) continue;
    const sector = (a / (Math.PI * 2)) * 18;
    if (Math.abs(sector - Math.round(sector)) < 0.06) continue;
    crowd.push({ a, rr, b: 0.35 + r() * 0.65, d: r(), i: crowd.length });
  }
}

// ---------- 通用绘制 ----------
function text(str, x, y, { size = 48, font = FONT_CN, weight = 'bold', color = COL.white, align = 'center', alpha = 1, spacing = 0, base = 'middle' } = {}) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = `${weight} ${size}px ${font}`;
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base;
  if (spacing) ctx.letterSpacing = `${spacing}px`;
  ctx.fillText(str, x, y);
  ctx.restore();
}
function strokeText(str, x, y, { size = 200, font = FONT_NUM, color = COL.gold, width = 2, alpha = 1, align = 'center', spacing = 0 } = {}) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha;
  ctx.font = `bold ${size}px ${font}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (spacing) ctx.letterSpacing = `${spacing}px`;
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.strokeText(str, x, y);
  ctx.restore();
}
function line(x0, y0, x1, y1, { color = COL.gold, width = 2, alpha = 1 } = {}) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.strokeStyle = color; ctx.lineWidth = width;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); ctx.restore();
}
function partialPolyline(pts, frac) {
  if (frac <= 0) return;
  let total = 0; const seg = [];
  for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(l); total += l; }
  let remain = total * clamp(frac);
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) {
    if (remain >= seg[i - 1]) { ctx.lineTo(pts[i][0], pts[i][1]); remain -= seg[i - 1]; }
    else { const f = remain / seg[i - 1]; ctx.lineTo(lerp(pts[i - 1][0], pts[i][0], f), lerp(pts[i - 1][1], pts[i][1], f)); break; }
  }
  ctx.stroke();
}
function arcPts(cx, cy, r, a0, a1, n = 64) {
  const p = [];
  for (let i = 0; i <= n; i++) { const a = lerp(a0, a1, i / n); p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  return p;
}
// 整屏铺满图片，s 为相对缩放，(fx, fy) 为画面中心在图上的位置（0..1）
function cover(im, { s = 1, fx = 0.5, fy = 0.5, alpha = 1, filter = 'none', x = 0, y = 0, w = W, h = H } = {}) {
  if (!im || alpha <= 0) return;
  const sc = Math.max(w / im.width, h / im.height) * s;
  const iw = im.width * sc, ih = im.height * sc;
  let dx = x + w / 2 - fx * iw, dy = y + h / 2 - fy * ih;
  dx = clamp(dx, x + w - iw, x); dy = clamp(dy, y + h - ih, y);
  ctx.save(); ctx.globalAlpha *= alpha; ctx.filter = filter;
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.drawImage(im, dx, dy, iw, ih);
  ctx.restore();
}
// 竖窗真人画面：两侧是同一画面的模糊放大，中间是清晰画面，金色边线
function blurBack(im, { alpha = 1, dark = 0.3, tint = null } = {}) {
  if (!im || alpha <= 0) return;
  tctx.filter = 'blur(3px)';
  const sc = Math.max(tiny.width / im.width, tiny.height / im.height) * 1.15;
  tctx.drawImage(im, (tiny.width - im.width * sc) / 2, (tiny.height - im.height * sc) / 2, im.width * sc, im.height * sc);
  tctx.filter = 'none';
  ctx.save(); ctx.globalAlpha *= alpha * dark; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(tiny, 0, 0, W, H);
  if (tint) { ctx.globalAlpha = alpha * 0.4; ctx.fillStyle = tint; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
}
function panel(im, { x = (W - 834) / 2, y = 0, w = 834, h = 1080, alpha = 1, back = true, dark = 0.3, frame = true, s = 1, fx = 0.5, fy = 0.5, filter = 'none' } = {}) {
  if (!im || alpha <= 0) return;
  if (back) blurBack(im, { alpha, dark });
  cover(im, { x, y, w, h, s, fx, fy, alpha, filter });
  if (frame) {
    ctx.save(); ctx.globalAlpha *= alpha * 0.75; ctx.strokeStyle = COL.gold; ctx.lineWidth = 2;
    if (h >= H) { ctx.beginPath(); ctx.moveTo(x - 1, 0); ctx.lineTo(x - 1, H); ctx.moveTo(x + w + 1, 0); ctx.lineTo(x + w + 1, H); ctx.stroke(); }
    else ctx.strokeRect(x - 1, y - 1, w + 2, h + 2);
    ctx.restore();
  }
}
function flash(a, color = '#fff8e8') {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = clamp(a); ctx.fillStyle = color; ctx.fillRect(0, 0, W, H); ctx.restore();
}
function black(a) { flash(a, '#000'); }
function decay(t, t0, tau) { return t >= t0 ? Math.exp(-(t - t0) / tau) : 0; }
function hitSum(t, list, tau) { let s = 0; for (const b of list) s += decay(t, b, tau); return s; }
function withZoom(z, cx, cy, fn) { ctx.save(); ctx.translate(cx, cy); ctx.scale(z, z); ctx.translate(-cx, -cy); const r = fn(); ctx.restore(); return r; }

function drawCrowd(t, f, { alpha = 1, scale = 1, cx = 960, cy = 600, appear = null, pulse = 0, swirl = 0, collapse = 0, tone = null } = {}) {
  ctx.save();
  for (const p of crowd) {
    const ang = p.a + swirl * (1.4 - p.rr);
    const rr = p.rr * (1 - collapse);
    const x0 = Math.cos(ang) * rr, y0 = Math.sin(ang) * rr;
    const sx = cx + x0 * 900 * scale, sy = cy + y0 * 430 * scale;
    if (sx < -10 || sx > W + 10 || sy < -10 || sy > H + 10) continue;
    let a = alpha;
    if (appear !== null) a *= prog(appear, 0.9 * (p.rr - 0.36) + 0.5 * p.d, 0.25 + 0.9 * (p.rr - 0.36) + 0.5 * p.d);
    if (a <= 0) continue;
    const near = (y0 + 1) / 2;
    const size = lerp(1.2, 2.8, near) * scale;
    const fl = hash(p.i, f) < 0.0005;
    const br = clamp(p.b * (0.5 + 0.55 * pulse));
    ctx.globalAlpha = a * (fl ? 1 : lerp(0.35, 1, br) * lerp(0.55, 1, near));
    ctx.fillStyle = tone || (fl ? '#ffffff' : br > 0.8 ? COL.goldHi : COL.gold);
    const s = fl ? size * 2.2 : size;
    ctx.fillRect(sx - s / 2, sy - s / 2, s, s);
  }
  ctx.restore();
}
function flapDigit(x, y, d, land, t, { w = 120, h = 170, size = 150, seed = 0, color = null } = {}) {
  ctx.fillStyle = '#12141b'; ctx.fillRect(x - w / 2, y - h / 2, w, h);
  ctx.strokeStyle = 'rgba(216,180,106,0.5)'; ctx.lineWidth = 2; ctx.strokeRect(x - w / 2, y - h / 2, w, h);
  let shown = d, sy = 1;
  if (t < land) { const step = Math.floor(t * 30); shown = Math.floor(hash(seed, step) * 10); sy = 1 - 0.5 * ((t * 30) % 1); }
  const bounce = t >= land ? 1 + 0.12 * Math.exp(-(t - land) / 0.06) : 1;
  ctx.save(); ctx.translate(x, y); ctx.scale(bounce, sy * bounce);
  text(String(shown), 0, size * 0.053, { size, font: FONT_NUM, color: color || (t >= land ? COL.goldHi : COL.gold) });
  ctx.restore();
  ctx.fillStyle = COL.bg; ctx.fillRect(x - w / 2, y - 1.5, w, 3);
}
function nearestBeat(t, grid) { let b = grid[0]; for (const g of grid) if (Math.abs(g - t) < Math.abs(b - t)) b = g; return b; }
function goldBall(x, y, r, { alpha = 1, rot = 0, fill = COL.dark } = {}) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.rotate(rot);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = COL.goldHi; ctx.lineWidth = Math.max(2, r * 0.06); ctx.stroke();
  ctx.lineWidth = Math.max(1.5, r * 0.04);
  ctx.beginPath(); ctx.moveTo(-r, 0); ctx.lineTo(r, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(0, r); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(-r * 0.95, 0, r * 0.55, r * 0.9, 0, -Math.PI / 2, Math.PI / 2); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(r * 0.95, 0, r * 0.55, r * 0.9, 0, Math.PI / 2, Math.PI * 1.5); ctx.stroke();
  ctx.restore();
}
// 弹跳：落地时刻列表 → 当前高度（0 = 地面）
function bounceHeight(t, hits, h0) {
  if (t < hits[0]) { const k = prog(t, hits[0] - Math.sqrt(1), hits[0]); return h0 * (1 - k * k); }
  for (let i = 0; i < hits.length - 1; i++) {
    if (t < hits[i + 1]) { const a = hits[i], b = hits[i + 1], u = (t - a) / (b - a); const peak = h0 * Math.pow((b - a) / (hits[1] - hits[0]), 2) * 0.55; return 4 * peak * u * (1 - u); }
  }
  return 0;
}

// ================= 冷开场 =================
async function sc_open(t, f) {
  const [a, b] = S.open;
  const lt = t - a;
  const hits = EV.openBounces;
  // 一颗球落下弹起
  const ballA = 1 - prog(lt, 3.3, 4.2);
  if (ballA > 0) {
    const h = bounceHeight(lt, hits, 620);
    const r = 46;
    const fy = 760;
    const by = fy - r - h;
    const squash = hitSum(lt, hits, 0.05) * 0.18;
    ctx.save(); ctx.globalAlpha = ballA;
    // 地面光
    for (const hit of hits) {
      const k = lt - hit; if (k < 0 || k > 0.9) continue;
      ctx.beginPath(); ctx.ellipse(960, fy, 60 + k * 900, 8 + k * 60, 0, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255,226,160,${(1 - k / 0.9) * 0.6})`; ctx.lineWidth = 2; ctx.stroke();
    }
    line(560, fy, 1360, fy, { color: COL.goldDim, width: 2 });
    ctx.translate(960, by + r); ctx.scale(1 + squash, 1 - squash); ctx.translate(-960, -(by + r));
    goldBall(960, by, r, { rot: lt * 2.2 });
    ctx.restore();
  }
  text('NBA CHINA GAMES', 960, 330, { size: 30, font: FONT_NUM, color: COL.grey, spacing: 12, alpha: fade(lt, 1.0, 3.6, 0.5, 0.4) });
  // 光点汇成看台（球变成中央一点）
  const appear = prog(lt, 3.6, 7.6) * 1.9;
  const rw = lt - 9.6;
  const swirl = rw > 0 ? -easeIn(prog(rw, 0, 4.68)) * 9 : 0;
  const collapse = easeIn(prog(lt, 13.75, 14.28));
  const desat = prog(lt, 9.8, 12.0);
  if (lt > 3.4) {
    const pulse = 0.6 + 0.6 * prog(lt, 5.6, 7.3) - 0.4 * desat;
    drawCrowd(t, f, { appear, pulse, swirl, collapse, cy: 560, tone: desat > 0.5 ? '#9a8a6a' : null, alpha: 1 - 0.35 * desat });
    ctx.save(); ctx.globalAlpha = prog(lt, 3.6, 4.4) * (1 - collapse); ctx.strokeStyle = COL.gold; ctx.lineWidth = 2;
    ctx.translate(960, 560); ctx.rotate(swirl * 0.3);
    ctx.strokeRect(-200, -100, 400, 200);
    ctx.beginPath(); ctx.moveTo(0, -100); ctx.lineTo(0, 100); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
    goldBall(960, 560, lerp(46, 9, easeInOut(prog(lt, 3.4, 4.4))), { alpha: 1 - collapse });
  }
  // 年份倒退 2026 → 1979
  if (lt >= EV.rewind[0] - a - 0.2) {
    const [r0, r1] = EV.rewind;
    const u = prog(t, r0, r1);
    const year = Math.round(2026 - 47 * (1 - Math.pow(1 - u, 2.6)));
    const al = prog(t, r0 - 0.2, r0 + 0.2) * (1 - prog(t, r1 + 0.05, r1 + 0.3));
    ctx.save(); ctx.globalAlpha = al;
    ctx.fillStyle = 'rgba(5,6,10,0.65)'; ctx.fillRect(560, 430, 800, 260);
    const ds = String(year).split('').map(Number);
    ds.forEach((d, i) => flapDigit(960 - 225 + i * 150, 560, d, t >= r1 ? r1 : -10, t, { w: 136, h: 200, size: 180, seed: i + 40 }));
    ctx.restore();
  }
  black(prog(lt, 0, 0.25) < 1 ? 1 - prog(lt, 0, 0.25) : 0);
}

// ================= 1979：地球与航线 =================
const DC = [38.9, -77.0], BJ = [39.9, 116.4];
const rad = (d) => (d * Math.PI) / 180;
function slerpLatLon(p, q, u) {
  const v = ([la, lo]) => [Math.cos(rad(la)) * Math.cos(rad(lo)), Math.cos(rad(la)) * Math.sin(rad(lo)), Math.sin(rad(la))];
  const a = v(p), b = v(q);
  const dot = a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const om = Math.acos(dot);
  const s0 = Math.sin((1 - u) * om) / Math.sin(om), s1 = Math.sin(u * om) / Math.sin(om);
  const c = [a[0] * s0 + b[0] * s1, a[1] * s0 + b[1] * s1, a[2] * s0 + b[2] * s1];
  return [Math.asin(c[2]) * 180 / Math.PI, Math.atan2(c[1], c[0]) * 180 / Math.PI];
}
function proj([la, lo], [la0, lo0], R, cx, cy, lift = 0) {
  const f = rad(la), l = rad(lo), f0 = rad(la0), l0 = rad(lo0);
  const cosc = Math.sin(f0) * Math.sin(f) + Math.cos(f0) * Math.cos(f) * Math.cos(l - l0);
  const r = R * (1 + lift);
  return [cx + r * Math.cos(f) * Math.sin(l - l0), cy - r * (Math.cos(f0) * Math.sin(f) - Math.sin(f0) * Math.cos(f) * Math.cos(l - l0)), cosc];
}
async function sc_map(t, f) {
  const [a, b] = S.map;
  const lt = t - a;
  const al = prog(lt, 0, 0.5);
  const [r0, r1] = EV.arc;
  const u = prog(t, r0, r1);
  const center = [lerp(48, 52, u), lerp(-85, 105, easeInOut(prog(t, a + 0.3, r1 + 0.3)))];
  const zoomIn = easeIn(prog(lt, 7.0, 7.72));
  const R = lerp(430, 470, prog(lt, 0, 7.7)) * (1 + zoomIn * 6);
  const bjS = proj(BJ, center, R, 960, 560);
  const cx = 960 - (bjS[0] - 960) * zoomIn, cy = 560 - (bjS[1] - 560) * zoomIn;
  ctx.save(); ctx.globalAlpha = al;
  // 球体
  const g = ctx.createRadialGradient(cx - R * 0.3, cy - R * 0.3, R * 0.1, cx, cy, R);
  g.addColorStop(0, '#141722'); g.addColorStop(1, '#07080d');
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(216,180,106,0.45)'; ctx.lineWidth = 2; ctx.stroke();
  // 经纬网
  ctx.lineWidth = 1;
  const drawGeo = (pts) => {
    ctx.beginPath(); let pen = false;
    for (const p of pts) { const q = proj(p, center, R, cx, cy); if (q[2] > 0) { pen ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); pen = true; } else pen = false; }
    ctx.stroke();
  };
  ctx.strokeStyle = 'rgba(216,180,106,0.16)';
  for (let lo = -180; lo < 180; lo += 15) drawGeo(Array.from({ length: 61 }, (_, i) => [-90 + i * 3, lo]));
  for (let la = -75; la <= 75; la += 15) drawGeo(Array.from({ length: 121 }, (_, i) => [la, -180 + i * 3]));
  // 航线
  const N = 120, pts = [];
  for (let i = 0; i <= N * u; i++) { const k = i / N; pts.push(proj(slerpLatLon(DC, BJ, k), center, R, cx, cy, 0.12 * Math.sin(Math.PI * k))); }
  if (pts.length > 1) {
    ctx.strokeStyle = COL.goldHi; ctx.lineWidth = 3; ctx.beginPath();
    pts.forEach((q, i) => (i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]))); ctx.stroke();
    const hd = pts[pts.length - 1];
    if (u < 1) { ctx.beginPath(); ctx.arc(hd[0], hd[1], 7, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill(); }
  }
  // 城市
  const city = (p, cn, en, t0, side) => {
    const q = proj(p, center, R, cx, cy); if (q[2] <= 0) return;
    const ca = prog(t, t0, t0 + 0.4) * clamp(q[2] * 3);
    const pr = 1 + 0.6 * Math.sin((t - t0) * 6);
    ctx.save(); ctx.globalAlpha *= ca;
    ctx.beginPath(); ctx.arc(q[0], q[1], 8 * pr, 0, Math.PI * 2); ctx.fillStyle = COL.goldHi; ctx.fill();

function crt(im, x, y, w, h, { on = 1, alpha = 1, bezel = true, glow = 0.15 } = {}) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha;
  if (bezel) { ctx.fillStyle = '#121318'; ctx.beginPath(); ctx.roundRect(x - w * 0.06, y - h * 0.08, w * 1.12, h * 1.16, w * 0.05); ctx.fill(); ctx.strokeStyle = 'rgba(216,180,106,0.25)'; ctx.lineWidth = 2; ctx.stroke(); }
  ctx.beginPath(); ctx.roundRect(x, y, w, h, w * 0.06); ctx.clip();
  ctx.fillStyle = '#000'; ctx.fillRect(x, y, w, h);
  if (im && on > 0) {
    const sy = on < 1 ? Math.max(0.004, easeIn(on)) : 1;
    ctx.save(); ctx.translate(x + w / 2, y + h / 2); ctx.scale(1, sy); ctx.translate(-(x + w / 2), -(y + h / 2));
    ctx.filter = 'saturate(0.75) contrast(1.15) brightness(1.08)';

    ctx.filter = 'none';
    if (on < 1) { ctx.globalAlpha = 1 - on; ctx.fillStyle = '#fff'; ctx.fillRect(x, y, w, h); }
    ctx.restore();
  }
  ctx.globalAlpha = alpha * 0.5; ctx.fillStyle = scanPat; ctx.fillRect(x, y, w, h);
  const g = ctx.createRadialGradient(x + w / 2, y + h / 2, w * 0.2, x + w / 2, y + h / 2, w * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.7)');
  ctx.globalAlpha = alpha; ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
  ctx.globalAlpha = alpha * glow; ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath(); ctx.ellipse(x + w * 0.3, y + h * 0.2, w * 0.35, h * 0.12, -0.3, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// ================= 纯音乐卡点：2026 阵容 =================
const ROSTER = [
  ['r_kd1', '杜兰特', 'KEVIN DURANT'], ['r_kd2', '杜兰特', 'KEVIN DURANT'],
  ['r_amen', '阿门 · 汤普森', 'AMEN THOMPSON'], ['r_amen2', '阿门 · 汤普森', 'AMEN THOMPSON'],
  ['r_flagg', '弗拉格', 'COOPER FLAGG'], ['r_kyrie', '欧文', 'KYRIE IRVING'],
  ['r_dunk1', '', ''], ['r_dunk2', '', ''],
  ['card', '', ''], ['card', '', ''],
  ['y1979', '', ''], ['y2004', '', ''], ['y2026', '', ''],
];
async function sc_roster(t, f) {
  const cuts = EV.rosterCuts;
  let i = 0; while (i < cuts.length - 1 && t >= cuts[i + 1]) i++;
  const lt = t - cuts[i];
  const [name, cn, en] = ROSTER[i];
  const kick = decay(lt, 0, 0.14);
  if (name.startsWith('r_')) {
    const im = MAN[name] ? await clip(name, lt) : null;
    if (im) {
      blurBack(im, { dark: 0.3, tint: '#c8202f' });
      panel(im, { s: 1.04 + 0.1 * kick + 0.05 * lt, fy: 0.42 });
      if (cn) {
        text(cn, 1440, 520, { size: 84, color: COL.white, align: 'left', alpha: prog(lt, 0.03, 0.1) });
        text(en, 1442, 600, { size: 30, font: FONT_NUM, color: COL.gold, align: 'left', spacing: 6, alpha: prog(lt, 0.06, 0.14) });
      }
    }
  } else if (name === 'card') {
    const k = t - cuts[8];
    const sl = easeOut5(prog(k, 0, 0.35));
    ctx.fillStyle = '#0a0b10'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = COL.red; ctx.fillRect(0, 0, lerp(0, 960, sl), H);
    ctx.fillStyle = '#0b2e5c'; ctx.fillRect(W - lerp(0, 960, sl), 0, 960, H);
    text('火箭', 480, 500, { size: 150, color: COL.white, alpha: sl });
    text('HOUSTON', 480, 620, { size: 40, font: FONT_NUM, color: 'rgba(255,255,255,0.75)', spacing: 10, alpha: sl });
    text('独行侠', 1440, 500, { size: 150, color: COL.white, alpha: sl });
    text('DALLAS', 1440, 620, { size: 40, font: FONT_NUM, color: 'rgba(255,255,255,0.75)', spacing: 10, alpha: sl });
    const vs = decay(t, cuts[9], 0.2);
    text('VS', 960, 540, { size: 180 * (1 + 0.3 * vs), font: FONT_NUM, color: COL.goldHi, alpha: prog(t, cuts[9] - 0.05, cuts[9]) });
    text('NBA 中国赛 · 2026 · 澳门', 960, 860, { size: 40, color: COL.white, alpha: prog(t, cuts[9], cuts[9] + 0.2), spacing: 6 });
  } else {
    const yr = name.slice(1);
    const bg = { '1979': GEN.bj1979_bikes, '2004': null, '2026': null }[yr];
    if (yr === '1979') cover(bg, { s: 1.1 + 0.05 * lt, filter: 'sepia(0.5) contrast(1.1) brightness(0.7)' });
    if (yr === '2004') { const im = await clip('dunk', 2.83); if (im) cover(im, { s: 1.08 + 0.05 * lt, filter: 'brightness(0.7)' }); }
    if (yr === '2026') drawCrowd(t, f, { pulse: 1.2, scale: 1.1 });
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    strokeText(yr, 960, 540, { size: 380 * (1 + 0.15 * kick), color: COL.goldHi, width: 4 });
    ctx.restore();
  }
  flash(kick * 0.35);
}

// ================= 四十七年，球一直在跳 =================
async function sc_finale(t, f) {
  const [a, b] = S.finale;
  const lt = t - a, d = b - a;
  const hits = EV.endBounces;
  const blendA = 1 - prog(t, hits[0] - 0.6, hits[0]);
  if (blendA > 0) {
    drawCrowd(t, f, { pulse: 0.8, alpha: blendA * 0.8, scale: lerp(1.3, 0.9, lt / d) });
    const im = await clip('dunk', 2.83);
    cover(im, { s: 1.15, alpha: blendA * 0.35, filter: 'grayscale(0.6)' });
    cover(GEN.bj1979_bikes, { s: 1.15, alpha: blendA * 0.25, filter: 'sepia(0.7)' });
  }
  text('47', 960, 470, { size: 360, font: FONT_NUM, color: COL.goldHi, alpha: fade(lt, 0.15, hits[0] - a, 0.3, 0.4) });
  text('年', 960 + 230, 560, { size: 70, color: COL.gold, alpha: fade(lt, 0.4, hits[0] - a, 0.3, 0.4) });
  // 一颗球落下：首尾呼应
  if (t > hits[0] - 1.0) {
    const h = bounceHeight(t, hits, 560);
    const fy = 760, r = 46;
    line(560, fy, 1360, fy, { color: COL.goldDim, width: 2, alpha: prog(t, hits[0] - 1, hits[0] - 0.6) });
    for (const hit of hits) { const k = t - hit; if (k < 0 || k > 0.9) continue; ctx.beginPath(); ctx.ellipse(960, fy, 60 + k * 900, 8 + k * 60, 0, 0, Math.PI * 2); ctx.strokeStyle = `rgba(255,226,160,${(1 - k / 0.9) * 0.6})`; ctx.lineWidth = 2; ctx.stroke(); }
    goldBall(960, fy - r - h, r, { rot: t * 2.2, alpha: prog(t, hits[0] - 1, hits[0] - 0.7) });
  }
}

// ================= 片尾 =================
async function sc_end(t, f) {
  const [a, b] = S.end;
  const lt = t - a, d = b - a;
  const hits = EV.endBounces;
  const fy = 760, r = 46;
  const h = bounceHeight(t, hits, 560);
  const up = easeInOut(prog(lt, 1.3, 2.2));
  goldBall(960, lerp(fy - r - h, 300, up), lerp(r, 34, up), { rot: t * 2.2, alpha: 1 - prog(lt, d - 0.8, d - 0.3) });
  const ea = prog(lt, 1.6, 2.2) * (1 - prog(lt, d - 0.8, d - 0.3));
  text('NBA CHINA GAMES', 960, 470, { size: 96, font: FONT_NUM, color: COL.goldHi, spacing: 18, alpha: ea });
  text('NBA 中国赛 · 2026 · 澳门', 960, 580, { size: 48, color: COL.white, alpha: ea, spacing: 8 });
  text('火箭  vs  独行侠', 960, 660, { size: 36, color: COL.gold, alpha: ea, spacing: 6 });
  text('音乐：“Five Armies” “Heroic Age” Kevin MacLeod (incompetech.com) · CC BY 4.0', 960, 1010, { size: 18, font: FONT_UI, weight: '', color: COL.grey, alpha: ea * 0.8 });
}

// ---------- 字幕 ----------
const NOSUB = new Set(['L18']);
function subtitles(t) {
  for (const v of TL.vo) {
    if (NOSUB.has(v.id)) continue;
    const a = v.t, b = v.t + v.dur + 0.25;
    const al = prog(t, a, a + 0.12) * (1 - prog(t, b - 0.15, b));
    if (al <= 0) continue;
    const s = v.text.replace(/[，。]$/, '');
    ctx.save(); ctx.globalAlpha = al;
    ctx.font = `bold 44px ${FONT_UI}`;
    const w = ctx.measureText(s).width;
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(960 - w / 2 - 28, 960 - 36, w + 56, 72);
    ctx.fillStyle = COL.goldHi; ctx.fillRect(960 - w / 2 - 28, 960 + 34, w + 56, 2);
    ctx.restore();
    text(s, 960, 960, { size: 44, font: FONT_UI, color: COL.white, alpha: al });
  }
}

// ---------- 主函数 ----------
const SCENES = {
  open: sc_open, map: sc_map, bj1979: sc_bj1979, ruler: sc_ruler, paper: sc_paper, room: sc_room, vhs: sc_vhs,
  tvwall: sc_tvwall, yao: sc_yao, ticket: sc_ticket, crowd: sc_crowd, board: sc_board, dunk: sc_dunk, score: sc_score,
  span: sc_span, flip: sc_flip, lightsout: sc_lightsout, counter: sc_counter, cold: sc_cold, macau: sc_macau,
  macau2: sc_macau2, rockets: sc_rockets, roster: sc_roster, finale: sc_finale, end: sc_end,
};
const NO_BLOOM = new Set(['dunk']);
async function renderH(t) {
  const f = Math.round(t * FPS);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, W, H);
  let cur = null;
  for (const [name, [a, b]] of Object.entries(S)) {
    const start = name === 'roster' ? EV.rosterCuts[0] : a;
    if (t >= start && t < b) { cur = name; break; }
  }
  if (cur === 'rockets' && t >= EV.rosterCuts[0]) cur = 'roster';
  if (cur) { ctx.save(); await SCENES[cur](t, f); ctx.restore(); }
  ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.globalCompositeOperation = 'source-over';
  if (!NO_BLOOM.has(cur)) {
    bctx.clearRect(0, 0, W / 2, H / 2);
    bctx.filter = 'blur(9px)'; bctx.drawImage(cv, 0, 0, W / 2, H / 2); bctx.filter = 'none';
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.45; ctx.drawImage(bloomCv, 0, 0, W, H); ctx.restore();
  }
  if (!VMODE) subtitles(t);
  const g = grain[f % 4], ox = -Math.floor(hash(f, 21) * 512), oy = -Math.floor(hash(f, 22) * 512);
  for (let x = ox; x < W; x += 512) for (let y = oy; y < H; y += 512) ctx.drawImage(g, x, y);
  ctx.drawImage(vignette, 0, 0);
}

// ================= 竖版：取横版画面重新构图 + 竖版原生画面 =================
const VW = 1080, VH = 1920;
let VT;
function onV(fn) { const keep = ctx; ctx = vctx; try { fn(); } finally { ctx = keep; } }
function vBackdrop(dark = 0.35) {
  tctx.filter = 'blur(4px)';
  tctx.drawImage(cv, 0, 0, tiny.width, tiny.height);
  tctx.filter = 'none';
  const sc = Math.max(VW / tiny.width, VH / tiny.height);
  vctx.save(); vctx.globalAlpha = dark;
  vctx.drawImage(tiny, (VW - tiny.width * sc) / 2, (VH - tiny.height * sc) / 2, tiny.width * sc, tiny.height * sc);
  vctx.restore();
}
function vCompose(sh) {
  if (sh.layout === 'regions') {
    vBackdrop(0.18);
    for (const [[sx, sy, sw, shh], [dx, dy, dw, dh]] of sh.regions) vctx.drawImage(cv, sx, sy, sw, shh, dx, dy, dw, dh);
    return;
  }
  vBackdrop(0.32);
  const z = sh.zoom, top = 900 - sh.cy * z, h = H * z;
  vctx.drawImage(cv, 540 - sh.cx * z, top, W * z, h);
  for (const [y0, dir] of [[top, 1], [top + h, -1]]) {
    const g = vctx.createLinearGradient(0, y0, 0, y0 + dir * 140);
    g.addColorStop(0, 'rgba(5,6,10,1)'); g.addColorStop(1, 'rgba(5,6,10,0)');
    vctx.fillStyle = g; vctx.fillRect(0, Math.min(y0, y0 + dir * 140), VW, 140);
  }
  if (sh.dim) { vctx.fillStyle = `rgba(0,0,0,${sh.dim})`; vctx.fillRect(0, 0, VW, VH); }
}
function vFlash(a, color = '#fff8e8') { if (a <= 0) return; vctx.save(); vctx.globalAlpha = clamp(a); vctx.fillStyle = color; vctx.fillRect(0, 0, VW, VH); vctx.restore(); }
function vHook(t) {
  const L = [['NBA 总裁', 128, COL.goldHi], ['在央视传达室', 100, COL.white], ['等了将近一小时', 100, COL.white]];
  const out = 1 - prog(t, 5.45, 5.8);
  text('1989 · 北京', 540, 520, { size: 40, color: COL.gold, spacing: 8, alpha: prog(t, 0.2, 0.6) * out });
  L.forEach(([s, size, color], i) => {
    const t0 = VT.ev.hook[i];
    const k = prog(t, t0, t0 + 0.1);
    if (k <= 0) return;
    ctx.save(); ctx.translate(540, 720 + i * 170); const sc = lerp(1.5, 1, easeOut(k)) * (1 + 0.06 * decay(t, t0, 0.08)); ctx.scale(sc, sc);
    text(s, 0, 0, { size, color, alpha: k * out });
    ctx.restore();
  });
  vFlash(VT.ev.hook.reduce((s0, b) => s0 + decay(t, b, 0.07) * 0.3, 0));
}
function vSix(t) {
  const t0 = VT.ev.six;
  const a = prog(t, t0, t0 + 0.4);
  text('6', 540, 1180, { size: 360, font: FONT_NUM, color: '#c9ccd2', alpha: a });
  text('年', 540 + 150, 1260, { size: 80, color: '#9aa0a8', alpha: a });
  text('2019  →  2025', 540, 1440, { size: 44, font: FONT_NUM, color: COL.grey, spacing: 6, alpha: prog(t, t0 + 0.3, t0 + 0.7) });
}
function vCard(t) {
  const [c0, c1] = VT.ev.card;
  const k = easeOut5(prog(t, c0, c0 + 0.35));
  vctx.fillStyle = '#0a0b10'; vctx.fillRect(0, 0, VW, VH);
  vctx.fillStyle = COL.red; vctx.fillRect(0, 0, VW, lerp(0, 960, k));
  vctx.fillStyle = '#0b2e5c'; vctx.fillRect(0, VH - lerp(0, 960, k), VW, 960);
  text('火箭', 540, 560, { size: 190, color: COL.white, alpha: k });
  text('HOUSTON', 540, 720, { size: 48, font: FONT_NUM, color: 'rgba(255,255,255,0.75)', spacing: 12, alpha: k });
  text('独行侠', 540, 1300, { size: 190, color: COL.white, alpha: k });
  text('DALLAS', 540, 1460, { size: 48, font: FONT_NUM, color: 'rgba(255,255,255,0.75)', spacing: 12, alpha: k });
  const vs = decay(t, c1, 0.2);
  text('VS', 540, 960, { size: 200 * (1 + 0.3 * vs), font: FONT_NUM, color: COL.goldHi, alpha: prog(t, c1 - 0.05, c1) });
  vFlash(decay(t, c0, 0.1) * 0.3 + vs * 0.25);
}
function vEnd(t) {
  const hits = VT.ev.endBounces;
  const [a, b] = [VT.shots[VT.shots.length - 1].v0, VT.duration];
  const lt = t - a;
  const fy = 900, r = 56;
  const h = bounceHeight(t, hits, 520);
  for (const hit of hits) { const k = t - hit; if (k < 0 || k > 0.9) continue; ctx.beginPath(); ctx.ellipse(540, fy, 60 + k * 600, 8 + k * 50, 0, 0, Math.PI * 2); ctx.strokeStyle = `rgba(255,226,160,${(1 - k / 0.9) * 0.6})`; ctx.lineWidth = 2; ctx.stroke(); }
  line(240, fy, 840, fy, { color: COL.goldDim, width: 2 });
  goldBall(540, fy - r - h, r, { rot: t * 2.2, alpha: prog(lt, 0, 0.3) });
  const ea = prog(lt, 1.2, 1.7) * (1 - prog(t, b - 0.6, b - 0.1));
  text('47 年', 540, 520, { size: 150, color: COL.goldHi, alpha: prog(lt, 0.2, 0.6) * (1 - prog(t, b - 0.6, b - 0.1)) });
  text('NBA CHINA GAMES', 540, 1140, { size: 76, font: FONT_NUM, color: COL.goldHi, spacing: 12, alpha: ea });
  text('NBA 中国赛 · 2026 · 澳门见', 540, 1240, { size: 48, color: COL.white, alpha: ea, spacing: 4 });
  text('音乐：Kevin MacLeod (incompetech.com) · CC BY 4.0', 540, 1880, { size: 20, font: FONT_UI, weight: '', color: COL.grey, alpha: ea * 0.8 });
}
function vSubtitles(t) {
  for (const v of VT.vo) {
    const a = v.t, b = v.t + v.dur + 0.25;
    const al = prog(t, a, a + 0.12) * (1 - prog(t, b - 0.15, b));
    if (al <= 0) continue;
    const parts = v.text.replace(/[，。]$/, '').split(/(?<=[，。：、])/);
    const lines = [];
    for (const p of parts) { if (lines.length && (lines[lines.length - 1] + p).length <= 14) lines[lines.length - 1] += p; else lines.push(p); }
    const clean = lines.map((s) => s.replace(/[，。]$/, ''));
    clean.forEach((s, i) => {
      const y = 1500 - (clean.length - 1 - i) * 76;
      vctx.save(); vctx.globalAlpha = al; vctx.font = `bold 58px ${FONT_UI}`;
      const w = vctx.measureText(s).width;
      vctx.fillStyle = 'rgba(0,0,0,0.5)'; vctx.fillRect(540 - w / 2 - 24, y - 38, w + 48, 76);
      vctx.restore();
      onV(() => text(s, 540, y, { size: 58, font: FONT_UI, color: COL.white, alpha: al }));
    });
  }
}
async function renderV(t) {
  const f = Math.round(t * FPS);
  const sh = VT.shots.find((s) => t >= s.v0 && t < s.v1) || VT.shots[VT.shots.length - 1];
  vctx.globalAlpha = 1; vctx.filter = 'none';
  vctx.fillStyle = COL.bg; vctx.fillRect(0, 0, VW, VH);
  if (sh.h0 !== null) { await renderH(sh.h0 + (t - sh.v0)); vCompose(sh); }
  onV(() => {
    if (sh.native === 'hook') vHook(t);
    if (sh.native === 'six') vSix(t);
    if (sh.native === 'card') vCard(t);
    if (sh.native === 'end') vEnd(t);
    if (sh.title) text(sh.title, 540, 300, { size: 46, color: COL.goldHi, spacing: 6, alpha: prog(t, sh.v0, sh.v0 + 0.3) });
    if (!['hook', 'card', 'end'].includes(sh.native)) text('NBA 中国赛 · 47 年', 540, 170, { size: 30, color: COL.gold, spacing: 10, alpha: 0.75 });
  });
  vSubtitles(t);
  const g = grain[f % 4];
  for (let x = -Math.floor(hash(f, 21) * 512); x < VW; x += 512) for (let y = -Math.floor(hash(f, 22) * 512); y < VH; y += 512) vctx.drawImage(g, x, y);
}
window.renderFrame = VMODE ? renderV : renderH;

window.ready = (async () => {
  TL = await (await fetch('film_h.json')).json();
  S = TL.scenes; A = TL.anchors; EV = TL.ev;
  if (VMODE) VT = await (await fetch('film_v.json')).json();
  try { MAN = await (await fetch('clips/manifest.json')).json(); } catch (e) { MAN = {}; }
  if (!MAN.dunk) MAN.dunk = { n: 132 };
  scanPat = ctx.createPattern(scan, 'repeat');
  await Promise.all(GEN_NAMES.map(async (n) => { GEN[n] = await loadImg(`../assets/gen/${n}.png`); }));
  window.DURATION = VMODE ? VT.duration : TL.duration;
  window.FPS = FPS;
  await Promise.all([
    document.fonts.load(`bold 100px ${FONT_CN}`),
    document.fonts.load(`bold 100px ${FONT_UI}`),
    document.fonts.load(`100px ${FONT_UI}`),
    document.fonts.load(`bold 100px ${FONT_NUM}`),
  ]);
})();
