// ---------- 时间映射：视频时间 τ → 动捕时间 m（单调三次插值，做出升格/子弹时间） ----------
const TK = [0, 1.0, 1.45, 2.55, 2.72, 3.45, 4.4];
const MK = [2.05, 3.0, 3.30, 3.418, 3.47, 3.80, 4.30];
const pchip = (() => {
  const n = TK.length, d = [], m = new Array(n);
  for (let i = 0; i < n - 1; i++) d.push((MK[i + 1] - MK[i]) / (TK[i + 1] - TK[i]));
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : 2 / (1 / d[i - 1] + 1 / d[i]);
  return (t) => {
    let i = 0; while (i < n - 2 && t > TK[i + 1]) i++;
    const h = TK[i + 1] - TK[i], s = clamp((t - TK[i]) / h);
    const s2 = s * s, s3 = s2 * s;
    return (2 * s3 - 3 * s2 + 1) * MK[i] + (s3 - 2 * s2 + s) * h * m[i] + (-2 * s3 + 3 * s2) * MK[i + 1] + (s3 - s2) * h * m[i + 1];

})();

const rotY90 = (v) => new THREE.Vector3(v.z, v.y, -v.x);
function mocapAt(mt) {

  const A = mocap.frames[i], B = mocap.frames[i + 1];

}

function buildGeometry(src) {
  const P = src.attributes.position, SI = src.attributes.skinIndex, SW = src.attributes.skinWeight;
  const idx = src.index ? Array.from(src.index.array) : [...Array(P.count).keys()];
  const keyMap = new Map(), remap = [], pos = [], skin = [];
  for (let i = 0; i < P.count; i++) {
    const k = `${P.getX(i).toFixed(4)},${P.getY(i).toFixed(4)},${P.getZ(i).toFixed(4)}`;
    if (!keyMap.has(k)) {
      keyMap.set(k, pos.length);
      pos.push([P.getX(i), P.getY(i), P.getZ(i)]);
      const m = new Map();
      for (let c = 0; c < 4; c++) { const w = SW.getComponent(i, c); if (w > 0) m.set(SI.getComponent(i, c), w); }
      skin.push(m);
    }
    remap.push(keyMap.get(k));
  }
  let faces = [];
  for (let i = 0; i < idx.length; i += 3) {
    const a = remap[idx[i]], b = remap[idx[i + 1]], c = remap[idx[i + 2]];
    if (a !== b && b !== c && a !== c) faces.push([a, b, c]);
  }
  let V = pos, S = skin;
  const mixSkin = (list) => { const m = new Map(); for (const [s, w] of list) for (const [b, x] of s) m.set(b, (m.get(b) || 0) + x * w); return m; };
  for (let it = 0; it < 2; it++) {
    const nb = V.map(() => new Set()), edges = new Map();
    const ek = (a, b) => (a < b ? a * 1e6 + b : b * 1e6 + a);
    for (const [a, b, c] of faces) for (const [x, y, z] of [[a, b, c], [b, c, a], [c, a, b]]) {
      nb[x].add(y); nb[y].add(x);
      const k = ek(x, y); if (!edges.has(k)) edges.set(k, { a: x, b: y, opp: [] }); edges.get(k).opp.push(z);
    }
    const boundary = new Set();
    for (const e of edges.values()) if (e.opp.length !== 2) { boundary.add(e.a); boundary.add(e.b); }
    const NV = V.map((p, i) => {
      if (boundary.has(i)) return p.slice();
      const n = nb[i].size, beta = n > 3 ? 3 / (8 * n) : 3 / 16;
      const q = p.map((x) => x * (1 - n * beta));
      for (const j of nb[i]) for (let c = 0; c < 3; c++) q[c] += beta * V[j][c];
      return q;
    });
    const NS = S.slice();
    for (const e of edges.values()) {
      e.idx = NV.length;
      const { a, b, opp } = e;
      if (opp.length === 2) {
        NV.push([0, 1, 2].map((c) => 0.375 * (V[a][c] + V[b][c]) + 0.125 * (V[opp[0]][c] + V[opp[1]][c])));
      } else NV.push([0, 1, 2].map((c) => 0.5 * (V[a][c] + V[b][c])));
      NS.push(mixSkin([[S[a], 0.5], [S[b], 0.5]]));
    }
    const NF = [];
    for (const [a, b, c] of faces) {
      const ab = edges.get(ek(a, b)).idx, bc = edges.get(ek(b, c)).idx, ca = edges.get(ek(c, a)).idx;
      NF.push([a, ab, ca], [ab, b, bc], [ca, bc, c], [ab, bc, ca]);
    }
    V = NV; S = NS; faces = NF;
  }
  // 法线
  const nrm = V.map(() => [0, 0, 0]);
  for (const [a, b, c] of faces) {
    const u = [0, 1, 2].map((k) => V[b][k] - V[a][k]), v = [0, 1, 2].map((k) => V[c][k] - V[a][k]);
    const n = [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]];
    for (const i of [a, b, c]) for (let k = 0; k < 3; k++) nrm[i][k] += n[k];
  }
  for (const n of nrm) { const l = Math.hypot(...n) || 1; n[0] /= l; n[1] /= l; n[2] /= l; }
  // 分区 + 膨胀出衣物厚度
  const region = new Float32Array(V.length);
  const posOut = new Float32Array(V.length * 3), rest = new Float32Array(V.length * 3);
  const si = new Uint16Array(V.length * 4), sw = new Float32Array(V.length * 4);
  for (let i = 0; i < V.length; i++) {
    const top = [...S[i]].sort((x, y) => y[1] - x[1]).slice(0, 4);
    const tot = top.reduce((s, x) => s + x[1], 0) || 1;
    top.forEach(([b, w], c) => { si[i * 4 + c] = b; sw[i * 4 + c] = w / tot; });
    const dom = boneNames[top[0][0]] || '';
    const [x, y, z] = V[i];
    const arm = /arm|hand|f_|thumb/.test(dom);
    let r = 0, inflate = 0;
    if (!arm) {
      if (y > 0.895 || (y > 0.80 && x < -0.01)) { r = 4; inflate = 0.004; }
      else if (y > 0.035 && y <= 0.6 && !(x > 0.045 && y > 0.53)) { r = 1; inflate = 0.012; }
      else if (y > -0.37 && y <= 0.035) { r = 2; inflate = 0.018 + 0.03 * sstep(0.0, -0.3, y); }
      else if (y < -0.885 || /foot|toe|heel/.test(dom)) { r = 3; inflate = 0.014; }
      else if (y < -0.8) { r = 5; inflate = 0.004; }
    }
    rest.set([x, y, z], i * 3);
    posOut.set([x + nrm[i][0] * inflate, y + nrm[i][1] * inflate, z + nrm[i][2] * inflate], i * 3);
    region[i] = r;
  }
  // 白色滚边：球衣/球裤与皮肤相邻的一圈顶点
  const trim = new Set();
  for (const f of faces) {
    const rs = f.map((i) => region[i]);
    if (rs.includes(0)) for (const i of f) if (region[i] === 1 || (region[i] === 2 && V[i][1] < -0.2)) trim.add(i);
  }
  for (const i of trim) region[i] = 6;
  const mask = new Float32Array(V.length * 4);
  for (let i = 0; i < V.length; i++) {
    const r = region[i];
    mask.set([r === 1 || r === 2 || r === 6 ? 1 : 0, r === 6 ? 1 : 0, r === 4 ? 1 : 0, r === 3 || r === 5 ? 1 : 0], i * 4);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(posOut, 3));
  g.setAttribute('restPos', new THREE.BufferAttribute(rest, 3));
  g.setAttribute('mask', new THREE.BufferAttribute(mask, 4));
  g.setAttribute('skinIndex', new THREE.BufferAttribute(si, 4));
  g.setAttribute('skinWeight', new THREE.BufferAttribute(sw, 4));
  g.setIndex(faces.flat());
  g.computeVertexNormals();
  console.log('subdivided verts', V.length, 'tris', faces.length);
  return g;
}

const rimUniforms = { uRimColor: { value: GOLD.clone() }, uRimStrength: { value: 0.65 }, uRimPow: { value: 3.2 } };
function bodyMaterial() {
  const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.55, metalness: 0.0 });
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, rimUniforms, { uPrint: { value: printTex } });

      .replace('#include <common>', '#include <common>\nattribute vec4 mask; attribute vec3 restPos; varying vec4 vMask; varying vec3 vRest;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvMask = mask; vRest = restPos;');

      .replace('#include <common>', `#include <common>

      .replace('#include <color_fragment>', `#include <color_fragment>
        float mCloth = smoothstep(0.35, 0.65, vMask.x), mTrim = smoothstep(0.35, 0.65, vMask.y);
        float mHair = smoothstep(0.35, 0.65, vMask.z), mGear = smoothstep(0.35, 0.65, vMask.w);
        vec3 white = vec3(0.58, 0.55, 0.52);
        vec3 cloth = vec3(0.30, 0.018, 0.03);

        else {

          float u = front ? (0.17 - vRest.z) / 0.34 : (vRest.z + 0.17) / 0.34;
          float v = (vRest.y - 0.12) / 0.40;
          if (u > 0.0 && u < 1.0 && v > 0.0 && v < 1.0) cloth = mix(cloth, vec3(0.92, 0.88, 0.80), texture2D(uPrint, vec2(u * 0.5 + (front ? 0.0 : 0.5), v)).r);
        }
        vec3 base = vec3(0.14, 0.094, 0.068);
        base = mix(base, cloth, mCloth);
        base = mix(base, white, mTrim);
        base = mix(base, vec3(0.015, 0.013, 0.012), mHair);
        base = mix(base, vec3(0.70, 0.68, 0.64), mGear);
        diffuseColor.rgb = base;`)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
        roughnessFactor = mix(mix(0.62, 0.78, max(mCloth, mGear)), 0.9, mHair);`)
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        float fr = pow(1.0 - clamp(abs(dot(normal, normalize(vViewPosition))), 0.0, 1.0), uRimPow);
        float faceDamp = (vRest.y > 0.72 && vRest.x > 0.0) ? 0.35 : 1.0;

const CHAIN = [

  ['spine004', 'Neck', 'Head'], ['spine005', 'Head', 'Head_End'],
  ['shoulderL', 'LeftShoulder', 'LeftArm'], ['upper_armL', 'LeftArm', 'LeftForeArm'], ['forearmL', 'LeftForeArm', 'LeftHand'], ['handL', 'LeftHand', 'LeftHandIndex1'],

function makeRig(root) {
  root.scale.setScalar(SCALE);
  root.updateMatrixWorld(true);
  const B = {}; root.traverse((o) => { if (o.isBone) B[o.name] = o; });
  const rest = {};
  for (const n in B) rest[n] = B[n].quaternion.clone();

  for (const [n] of CHAIN) dirLocal[n] = CHILD[n] ? B[CHILD[n]].position.clone().normalize() : new THREE.Vector3(0, 1, 0);
  const wp = (n) => B[n].getWorldPosition(new THREE.Vector3());

    spine: { up: toLocalDir('spine', wp('spine001').sub(wp('spine'))), right: toLocalDir('spine', wp('thighR').sub(wp('thighL'))) },
    spine003: { up: toLocalDir('spine003', wp('spine004').sub(wp('spine003'))), right: toLocalDir('spine003', wp('upper_armR').sub(wp('upper_armL'))) },
  };

    const u = up.clone().normalize(), r = right.clone().addScaledVector(u, -right.dot(u)).normalize();
    return new THREE.Matrix4().makeBasis(r, u, new THREE.Vector3().crossVectors(r, u));
  };

  const setWorldQ = (b, wq) => { b.quaternion.copy(parentQ(b).invert().multiply(wq)); b.updateMatrixWorld(true); };
  const alignBasis = (n, up, right) => {
    const b = B[n], Mt = frame(up, right);
    const wq = new THREE.Quaternion().setFromRotationMatrix(Mt.multiply(basis[n].M.clone().transpose()));
    setWorldQ(b, wq);
  };

    if (target.lengthSq() < 1e-8) return;
    const b = B[n];
    const w0 = parentQ(b).multiply(rest[n]);
    const cur = dirLocal[n].clone().applyQuaternion(w0);
    const q = new THREE.Quaternion().setFromUnitVectors(cur, target.clone().normalize());
    setWorldQ(b, q.multiply(w0));
  };

  let jumpGain = 1;
  function pose(mt) {
    const p = mocapAt(mt);
    for (const n in B) B[n].quaternion.copy(rest[n]);
    const hips = p('Hips');
    B.spine.position.copy(B.spine.parent.worldToLocal(hips.clone().multiplyScalar(1.12)));
    root.updateMatrixWorld(true);
    alignBasis('spine', p('LowerBack').sub(hips).add(p('Spine').sub(hips)), p('RightUpLeg').sub(p('LeftUpLeg')));
    alignDir('spine001', p('Spine').sub(p('LowerBack')));
    alignDir('spine002', p('Spine1').sub(p('Spine')));
    alignBasis('spine003', p('Neck1').sub(p('Spine1')), p('RightArm').sub(p('LeftArm')));
    for (const [n, a, b] of CHAIN) if (!/^spine00[12]$/.test(n)) alignDir(n, p(b).sub(p(a)));
    // 落地修正：让模型的脚底高度跟随动捕脚高（乘以跳跃增益）
    const mocapFoot = Math.min(p('LeftToeBase').y, p('RightToeBase').y, p('LeftFoot').y - 0.05, p('RightFoot').y - 0.05);
    const target = Math.max(0, mocapFoot - 0.035) * 1.12 * jumpGain;
    const modelFoot = Math.min(wp('toeL').y, wp('toeR').y, wp('footL').y - 0.07 * SCALE, wp('footR').y - 0.07 * SCALE) - sole;
    const wpos = B.spine.getWorldPosition(new THREE.Vector3());
    wpos.y += target - modelFoot;
    B.spine.position.copy(B.spine.parent.worldToLocal(wpos));
    root.updateMatrixWorld(true);
  }
  return { root, B, pose, wp, setJumpGain: (g) => { jumpGain = g; } };
}

}

// ---------- 求解：扣篮瞬间手的位置 → 决定篮筐位置和跳跃增益 ----------
const ball = new THREE.Group();
function ballCarry(mt) {
  const hl = rig.wp('handL'), hr = rig.wp('handR');
  const dirR = new THREE.Vector3(0, 1, 0).applyQuaternion(rig.B.handR.getWorldQuaternion(new THREE.Quaternion()));

  const one = hr.clone().addScaledVector(dirR, 0.11).add(new THREE.Vector3(0.02, 0.09, 0));
  return two.lerp(one, sstep(3.12, 3.26, mt));
}
// 让扣篮瞬间球心比篮筐高 0.20 m：跳跃增益对球高是线性的，取两点解

function netPoint(i, j, w) {
  const v = j / (NET_R - 1);
  const twist = (j % 2) * Math.PI / NET_S;
  const ang = (i / NET_S) * Math.PI * 2 + twist;
  const pulse = w > 0 ? Math.exp(-w * 5) * Math.sin(w * 26) : 0;
  const pass = w > 0 ? Math.exp(-Math.pow((w - 0.06 - v * 0.06) * 14, 2)) : 0;
  const r = 0.229 * (1 - 0.42 * v) * (1 + 0.35 * pass) + 0.01 * pulse * v;
  const y = -0.42 * v * (1 + 0.25 * pass + 0.08 * pulse);
  return [-0.229 + Math.cos(ang) * r + 0.04 * pulse * v, y, Math.sin(ang) * r];
}
function updateNet(w) {

  for (let j = 0; j < NET_R - 1; j++) for (let i = 0; i < NET_S; i++) {
    put(netPoint(i, j, w)); put(netPoint(i, j + 1, w));

}

      void main(){ vec2 p = vUv - 0.5; float r = length(p);
        float core = exp(-r * r * 380.0) * 1.25 + exp(-r * r * 45.0) * 0.32 + exp(-r * 5.0) * 0.07;
        float streak = exp(-p.y * p.y * 4000.0) * exp(-abs(p.x) * 6.0) * 0.35;
        vec3 c = mix(vec3(1.0, 0.55, 0.22), vec3(1.0, 0.93, 0.82), clamp(core * 0.6, 0.0, 1.0));
        gl_FragColor = vec4(c * (core + streak) * uI, 1.0); }`,
  });
  const glow = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), glowMat);
  glow.scale.setScalar(46); glow.renderOrder = -1; scene.add(glow);
  // 烟：几张大的噪声贴图，慢慢飘
  const smokeC = mkCanvas(512, 512);
  {
    const g = smokeC.getContext('2d'), id = g.createImageData(512, 512);
    const hashN = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
    const vnoise = (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
      return lerp(lerp(hashN(xi, yi), hashN(xi + 1, yi), u), lerp(hashN(xi, yi + 1), hashN(xi + 1, yi + 1), u), v); };
    for (let y = 0; y < 512; y++) for (let x = 0; x < 512; x++) {
      let n = 0, a = 0.5, f = 1 / 64;
      for (let o = 0; o < 5; o++) { n += a * vnoise(x * f, y * f); a *= 0.5; f *= 2; }
      const r = Math.hypot(x - 256, y - 256) / 256, m = Math.max(0, 1 - r) ** 1.6;
      const v = Math.max(0, n - 0.35) * 1.8 * m;
      id.data.set([255, 255, 255, Math.min(255, v * 255)], (y * 512 + x) * 4);
    }
    g.putImageData(id, 0, 0);
  }
  const smokeTex = new THREE.CanvasTexture(smokeC);
  const smokes = [];
  for (let i = 0; i < 14; i++) {
    const m = new THREE.SpriteMaterial({ map: smokeTex, color: 0xffb070, transparent: true, opacity: 0.025 + rand() * 0.03, blending: THREE.AdditiveBlending, depthWrite: false, rotation: rand() * 6.28 });
    const s = new THREE.Sprite(m);
    const base = new THREE.Vector3(RIM.x - 6 + rand() * 9, 0.6 + rand() * 4.5, RIM.z - 5 + rand() * 10);
    s.scale.setScalar(4 + rand() * 5); scene.add(s);
    smokes.push({ s, base, v: rand() * 0.25 + 0.05, ph: rand() * 6.28 });
  }
  nikeUpdate = (focus, hit, mt) => {
    bloom.threshold = 0.82; bloom.radius = 0.6;
    const dir = focus.clone().sub(camera.position).normalize();
    const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0, 1, 0)).normalize();
    glow.position.copy(focus).addScaledVector(dir, 22).addScaledVector(right, -6.5).add(new THREE.Vector3(0, 4.5, 0));
    glow.lookAt(camera.position);
    glowMat.uniforms.uI.value = 1 + 1.2 * hit;
    for (const k of smokes) {
      k.s.position.copy(k.base).add(new THREE.Vector3(Math.sin(mt * k.v + k.ph) * 0.6, mt * k.v * 0.3, Math.cos(mt * k.v * 0.7 + k.ph) * 0.6));
    }
    bloom.strength = 0.55 + 0.8 * hit;
  };
}

// ---------- 后期 ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.5, 0.4, 0.82);
const bokeh = new BokehPass(scene, camera, { focus: 5, aperture: 0.0016, maxblur: 0.006 });
composer.addPass(bokeh);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const grain = [0, 1, 2, 3].map((k) => {
  const c = mkCanvas(512, 512), g = c.getContext('2d'), id = g.createImageData(512, 512);
  for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (rand() - 0.5) * 120; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  g.putImageData(id, 0, 0); return c;
});

// ---------- 镜头：一镜到底，绕着人和篮筐之间的焦点运动 ----------
const CAMK = [
  // τ, 方位角(从 +Z 侧面起算, 度), 仰角(度), 距离, 焦点偏向篮筐的比例, 焦点高度偏移, 视角
  [0.0, 6, 4, 8.6, 0.10, -0.15, 30],
  [1.0, 10, 2, 6.8, 0.18, 0.05, 32],
  [1.45, 18, -4, 5.6, 0.35, 0.25, 34],
  [2.0, 36, -10, 4.8, 0.45, 0.30, 36],
  [2.55, 56, -14, 4.3, 0.55, 0.35, 38],
  [2.72, 62, -16, 3.8, 0.62, 0.25, 40],
  [3.0, 66, -12, 4.2, 0.45, -0.1, 38],
  [3.6, 72, -9, 4.6, 0.25, -0.5, 36],
  [4.4, 78, -5, 5.6, 0.18, -0.6, 34],
];
function camAt(tau) {
  let i = 0; while (i < CAMK.length - 2 && tau > CAMK[i + 1][0]) i++;
  const a = CAMK[i], b = CAMK[i + 1], u = sstep(a[0], b[0], tau);
  return a.map((v, k) => (k === 0 ? tau : lerp(v, b[k], u)));
}

const HUD_F = '"PingFang SC", "Helvetica Neue", sans-serif', NUM_F = '"DIN Condensed", "Helvetica Neue", sans-serif';
function drawHud(tau, head) {
  const a = sstep(1.55, 1.8, tau) * (1 - sstep(2.6, 2.7, tau));
  if (a <= 0) return;
  const p = head.clone().project(camera);
  const x = (p.x * 0.5 + 0.5) * W, y = (-p.y * 0.5 + 0.5) * H;
  const draw = sstep(1.55, 1.85, tau);
  const lx = x - 180, ly = y - 150;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.strokeStyle = 'rgba(255,200,120,0.9)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x - 8, y - 8); ctx.lineTo(lerp(x - 8, lx, draw), lerp(y - 8, ly, draw)); ctx.lineTo(lx - 260 * sstep(1.75, 1.95, tau), ly); ctx.stroke();
  const ta = sstep(1.8, 2.0, tau);
  ctx.globalAlpha = a * ta;
  ctx.textAlign = 'right'; ctx.fillStyle = '#ffd9a0';
  ctx.font = `bold 96px ${NUM_F}`; ctx.fillText('11', lx - 300, ly - 12);
  ctx.font = `600 40px ${HUD_F}`; ctx.fillStyle = '#fff3e0'; ctx.fillText('姚明', lx - 8, ly - 46);
  ctx.font = `500 22px ${NUM_F}`; ctx.fillStyle = 'rgba(255,220,170,0.85)'; ctx.fillText('YAO MING  ·  2.26 M  ·  HOUSTON', lx - 8, ly - 14);
  // 篮筐高度标注
  const r = RIM.clone().project(camera), rx = (r.x * 0.5 + 0.5) * W, ry = (-r.y * 0.5 + 0.5) * H;
  ctx.globalAlpha = a * sstep(2.0, 2.2, tau);
  ctx.strokeStyle = 'rgba(255,200,120,0.7)'; ctx.setLineDash([6, 6]);
  ctx.beginPath(); ctx.moveTo(rx + 40, ry); ctx.lineTo(rx + 150, ry); ctx.stroke(); ctx.setLineDash([]);
  ctx.textAlign = 'left'; ctx.font = `500 30px ${NUM_F}`; ctx.fillStyle = '#ffd9a0'; ctx.fillText('3.05 M', rx + 160, ry + 10);
  ctx.restore();
}

window.DURATION = 4.4; window.FPS = 30;
const tauSlam = tauOfMocap(S_MOCAP), tauRim = tauOfMocap(S_MOCAP + tRim);
// τ 超出关键帧范围后按末段速度外推，用于给音效排弹跳时间
const tailRate = (MK[MK.length - 1] - MK[MK.length - 2]) / (TK[TK.length - 1] - TK[TK.length - 2]);
const tauExt = (mt) => (mt <= MK[MK.length - 1] ? tauOfMocap(mt) : TK[TK.length - 1] + (mt - MK[MK.length - 1]) / tailRate);
window.CUES3D = { tauSlam, tauRim, bounces: bounceMocap.map(tauExt) };
console.log('CUES3D', JSON.stringify(window.CUES3D));

const DEBUG = new URLSearchParams(location.search).get('debug');
window.renderFrame = (tau) => {
  if (DEBUG) {
    // ?debug=1：站立帧，绕人一周，tau 为方位角（度）
    rig.pose(1.0);
    const c = rig.wp('spine003'), a = THREE.MathUtils.degToRad(tau);
    camera.fov = 30; camera.updateProjectionMatrix();
    camera.position.set(c.x + Math.sin(a) * 4, c.y, c.z + Math.cos(a) * 4); camera.lookAt(c);
    ghosts.forEach((g) => (g.mesh.visible = false));
    composer.render(); ctx.drawImage(glCanvas, 0, 0); return;
  }
  const mt = pchip(tau);
  const w = mt - S_MOCAP;
  rig.pose(mt);
  // 球
  if (w < 0) ball.position.copy(ballCarry(mt));
  else ball.position.copy(ballFree(w).p);
  if (new URLSearchParams(location.search).get('log')) {
    const fwd = new THREE.Vector3(1, 0, 0).applyQuaternion(rig.B.spine.getWorldQuaternion(new THREE.Quaternion()));
    const bad = Object.entries(rig.B).filter(([, b]) => Math.abs(b.quaternion.length() - 1) > 1e-3).map(([n, b]) => n + ':' + b.quaternion.length().toFixed(3));
    console.log('bad quats', bad.join(' ') || 'none');
    console.log('τ', tau, 'mt', mt.toFixed(3), 'ball', fmt(ball.position), 'hips', fmt(rig.wp('spine')), 'head', fmt(rig.wp('spine005')), 'chest', fmt(rig.wp('spine003')), 'handR', fmt(rig.wp('handR')), 'fwd', fmt(fwd));
  }
  ballMesh.rotation.z = -mt * 9;
  // 残影
  const ghostA = sstep(1.35, 1.6, tau) * (1 - sstep(2.6, 2.85, tau));
  ghosts.forEach((g, k) => {
    g.mesh.visible = ghostA > 0.01;
    if (g.mesh.visible) g.r.pose(mt - 0.022 * (k + 1));
    g.u.value = ghostA * (0.28 - k * 0.08);
  });
  // 篮筐 & 网
  const wr = w - tRim;
  rimGroup.rotation.z = wr > 0 ? -0.09 * Math.exp(-wr * 7) * Math.sin(wr * 34 + 0.6) - 0.04 * Math.exp(-wr * 12) : 0;
  updateNet(wr);
  // 冲击
  const hit = wr > 0 ? Math.exp(-wr * 9) : 0;
  slamLight.intensity = 90 * hit;
  rimMat.emissiveIntensity = 0.2 + 2.2 * hit;
  rimMat.emissive.setHex(0xff4a10).lerp(new THREE.Color(0xffd8a0), hit);
  ring.scale.setScalar(0.3 + Math.max(0, wr) * 9);
  ring.material.opacity = wr > 0 ? Math.exp(-wr * 3) * 0.9 : 0;
  spkMat.uniforms.uW.value = wr > 0 ? wr : -1;
  crowdMat.uniforms.uT.value = Math.max(0, wr);
  crowdMat.uniforms.uFlash.value = wr > 0 ? 1 : 0;
  dustMat.uniforms.uT.value = mt * 4;
  bloom.strength = 0.5 + 1.0 * hit;
  rimUniforms.uRimStrength.value = 0.65 + 1.5 * hit;
  beamMat.uniforms.uI.value = 1 + 0.6 * hit;
  // 镜头
  const [, az, el, dist, bias, dy, fov] = camAt(tau);
  const head = rig.wp('spine005');
  const focus = head.clone().lerp(RIM, bias); focus.y += dy;
  const azr = THREE.MathUtils.degToRad(az), elr = THREE.MathUtils.degToRad(el);
  camera.position.set(focus.x - Math.sin(azr) * Math.cos(elr) * dist * -1, focus.y + Math.sin(elr) * dist, focus.z + Math.cos(azr) * Math.cos(elr) * dist);
  camera.position.y = Math.max(0.25, camera.position.y);
  const shake = 0.05 * hit;
  camera.position.x += Math.sin(tau * 91) * shake; camera.position.y += Math.cos(tau * 77) * shake;
  camera.fov = fov; camera.updateProjectionMatrix();
  camera.lookAt(focus);
  bokeh.uniforms.focus.value = camera.position.distanceTo(head);
  nikeUpdate(focus, hit, mt);
  composer.render();
  // 2D 合成
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.drawImage(glCanvas, 0, 0);
  drawHud(tau, head.clone().add(new THREE.Vector3(0, 0.12, 0)));
  if (hit > 0.01) { ctx.fillStyle = `rgba(255,236,200,${0.55 * Math.pow(hit, 2)})`; ctx.fillRect(0, 0, W, H); }
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.0);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.75)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.09;
  const gt = grain[Math.floor(tau * 30) % 4];
  for (let x = 0; x < W; x += 512) for (let y = 0; y < H; y += 512) ctx.drawImage(gt, x, y);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  const fo = sstep(3.95, 4.4, tau);
  if (fo > 0) { ctx.fillStyle = `rgba(0,0,0,${fo})`; ctx.fillRect(0, 0, W, H); }
};
window.ready = true;
</script></body></html>
