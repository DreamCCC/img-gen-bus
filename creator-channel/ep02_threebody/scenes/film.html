<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
import { W, H, FPS, setFilm, setClips, Ctx, makeFilm, FILM } from './film/lib.js';
import { createSpace } from './film/space.js';
import { buildShots } from './film/shots.js';

const OUT = document.getElementById('c');
const ctx = OUT.getContext('2d');
const g = Ctx(ctx);
const film = await (await fetch('/scenes/film.json')).json();
setFilm(film);
try { setClips(await (await fetch('/scenes/clips/manifest.json')).json()); } catch (e) { setClips({}); }
const space = createSpace(W, H);
const FX = makeFilm();
const SHOTS = await buildShots({ g, space, ctx, FX });

window.FPS = FPS;
window.DURATION = film.duration;
window.renderFrame = async (t) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  let subOn = true;
  for (const s of SHOTS) {
    const fi = s.fi ?? 0, fo = s.fo ?? 0;
    if (t < s.a - (s.pre ?? 0) || t >= s.b) continue;
    const a = (fi > 0 ? Math.min(1, Math.max(0, (t - s.a) / fi)) : t >= s.a ? 1 : 0) * (fo > 0 ? Math.min(1, Math.max(0, (s.b - t) / fo)) : 1);
    if (a <= 0) continue;
    ctx.save();
    ctx.globalAlpha = a;
    await s.draw(t - s.a, t, a);
    ctx.restore();
    if (s.noSub) subOn = false;
  }
  ctx.globalAlpha = 1;
  // 字幕：跟词级时间走
  if (subOn) {
    const sb = film.subs.find((x) => t >= x.t0 - 0.05 && t < x.t1 + 0.12);
    if (sb) g.sub(sb.text, 1);
  }
};
window.ready = Promise.resolve();
</script>
</body>
</html>
