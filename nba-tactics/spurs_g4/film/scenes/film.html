<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080, FPS = 30;
const MODE = new URLSearchParams(location.search).get('m') || 'h';
const mk = (w, h) => Object.assign(document.createElement('canvas'), { width: w, height: h });
const cv = document.getElementById('c');
let ctx = cv.getContext('2d');

const COL = {
  bg: '#231f20', ink: '#231f20', blue: '#1d428a', red: '#c8102e', white: '#ffffff', grey: '#c3ced3',
  mid: '#7f7f7f', light: '#d5d9dd', sas: '#c4ced4', nyk: '#006bb6', nykOr: '#f58426',
};
const F = {
  ui: '"PingFang SC", sans-serif',
  hd: '"NotoSansSC", "PingFang SC", sans-serif',
  num: '"Action NBA Condensed", "DIN Condensed", sans-serif',
  numW: '"Action NBA", "Action NBA Condensed", sans-serif',
  ko: '"Knockout", "Action NBA Condensed", sans-serif',
};
const SKEW = -0.21;

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const hash = (a, b = 0) => { const s = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453; return s - Math.floor(s); };
const pad = (k) => String(k).padStart(5, '0');
const decay = (t, t0, tau) => (t >= t0 ? Math.exp(-(t - t0) / tau) : 0);

const signed = (v) => (v > 0 ? `+${v}` : String(v));

let TL, T, S, GD = null, MAN = {}, LOGO = null;

// ---------- 素材帧 ----------
const imgCache = new Map();
function loadImg(src) {
  if (!imgCache.has(src)) {
    const im = new Image();
    im.src = src;
    imgCache.set(src, im.decode().then(() => im).catch(() => null));
    if (imgCache.size > 48) imgCache.delete(imgCache.keys().next().value);
  }
  return imgCache.get(src);
}
async function clip(name, lt) {
  const m = MAN[name];
  if (!m) return null;
  const k = clamp(Math.floor(lt * FPS + 1e-4), 0, m.n - 1);
  if (k + 1 < m.n) loadImg(`clips/${name}/${pad(k + 1)}.jpg`);
  return loadImg(`clips/${name}/${pad(k)}.jpg`);
}
function draw(im, { z = 1, fx = W / 2, fy = H / 2, filter = 'none', alpha = 1, dx = 0, dy = 0 } = {}) {
  if (!im) return;
  ctx.save();
  ctx.globalAlpha = alpha; ctx.filter = filter;
  ctx.translate(fx + dx, fy + dy); ctx.scale(z, z); ctx.translate(-fx, -fy);
  ctx.drawImage(im, 0, 0, W, H);
  ctx.restore();
}

// ---------- 颗粒与暗角 ----------
const grain = [];
  for (let k = 0; k < 4; k++) {
  const g = mk(512, 512), gx = g.getContext('2d'), id = gx.createImageData(512, 512);
  for (let i = 0; i < id.data.length; i += 4) { const v = hash(i, k) * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 14; }
  gx.putImageData(id, 0, 0); grain.push(g);
}
function vignette(a) {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 1.0);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function veil(a, color = '#000') { if (a <= 0) return; ctx.save(); ctx.globalAlpha = clamp(a); ctx.fillStyle = color; ctx.fillRect(0, 0, W, H); ctx.restore(); }
function shake(t, t0, amp = 18, tau = 0.18) {
  const d = decay(t, t0, tau) * amp;
  return [Math.sin(t * 97) * d, Math.cos(t * 83) * d * 0.7];
}

// ---------- 文字 ----------
function txt(s, x, y, { size = 48, font = F.ui, weight = 'bold', color = COL.white, align = 'center', alpha = 1, base = 'middle', stroke = 0, strokeColor = '#000', shadow = 0, spacing = 0 } = {}) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = clamp(alpha);
  ctx.font = `${weight} ${size}px ${font}`;
  ctx.textAlign = align; ctx.textBaseline = base;
  if (spacing) ctx.letterSpacing = `${spacing}px`;
  if (shadow) { ctx.shadowColor = 'rgba(0,0,0,0.75)'; ctx.shadowBlur = shadow; ctx.shadowOffsetY = shadow * 0.25; }
  if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = stroke; ctx.strokeStyle = strokeColor; ctx.strokeText(s, x, y); ctx.shadowColor = 'transparent'; }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
  ctx.restore();
}
function measure(s, { size = 48, font = F.ui, weight = 'bold', spacing = 0 } = {}) {
  ctx.save(); ctx.font = `${weight} ${size}px ${font}`; if (spacing) ctx.letterSpacing = `${spacing}px`;
  const w = ctx.measureText(s).width; ctx.restore(); return w;
}
// 一行多段不同字体的文字，整体按 align 对齐；parts: [[文字, txt 选项], ...]
function runs(parts, x, y, { align = 'center', alpha = 1, gap = 0 } = {}) {
  const ws = parts.map(([s, o]) => measure(s, o));
  const total = ws.reduce((a, b) => a + b, 0) + gap * (parts.length - 1);
  let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  parts.forEach(([s, o], i) => { txt(s, cx, y, { ...o, align: 'left', alpha: alpha * (o.alpha ?? 1) }); cx += ws[i] + gap; });
}
function slab(x, y, w, h, color, skew = SKEW) {
  const k = h * skew / 2;
  ctx.beginPath();
  ctx.moveTo(x - k, y); ctx.lineTo(x + w - k, y); ctx.lineTo(x + w + k, y + h); ctx.lineTo(x + k, y + h);
  ctx.closePath(); ctx.fillStyle = color; ctx.fill();
}
// 斜切色块 + 居中文字的小标签
function tag(s, cx, cy, { size = 34, bg = COL.red, fg = COL.white, font = F.hd, weight = 900, alpha = 1, align = 'center', padX = 0.55 } = {}) {
  if (alpha <= 0) return 0;
  const w = measure(s, { size, font, weight }) + size * padX * 2, h = size * 1.5;
  const x0 = align === 'center' ? cx - w / 2 : align === 'right' ? cx - w : cx;
  ctx.save(); ctx.globalAlpha = clamp(alpha); slab(x0, cy - h / 2, w, h, bg); ctx.restore();
  txt(s, x0 + w / 2, cy + size * 0.04, { size, font, weight, color: fg, alpha });
  return w;
}

// orb=false：去掉右下蓝色大圆，给需要整幅宽度的图表用
function courtBg(u, { orb = true } = {}) {
  ctx.fillStyle = COL.ink; ctx.fillRect(0, 0, W, H);
  const d = easeOut(clamp(u / 0.8));
  ctx.save();
  if (orb) {
    ctx.fillStyle = COL.blue; ctx.beginPath(); ctx.arc(W + 900, H + 400, 1500, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 12;
    ctx.beginPath(); ctx.arc(W + 900, H + 400, 1530, Math.PI, Math.PI + 0.9 * d); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 10;
  ctx.beginPath(); ctx.arc(560, -380, 640, 0.15, Math.PI - 0.15); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = 'rgba(35,31,32,0.55)'; ctx.fillRect(0, 0, W, H);
}

// 花字（NBA 图文风格）：斜切色块从左擦入，白字跟进；kicker 为英文小标
// anim: wipe 擦入 / slam 砸入
function huazi(t, t0, s, x, y, { size = 120, bg = COL.red, fg = COL.white, kicker = '', kc = COL.white, anim = 'wipe', align = 'center', hold = 99, out = 0.22, rot = 0 } = {}) {
  const u = t - t0;
  if (u < 0 || u > hold + out) return;
  ctx.save();
  ctx.font = `900 ${size}px ${F.hd}`;
  const tw = ctx.measureText(s).width;
  const padX = size * 0.42, h = size * 1.32, w = tw + padX * 2;
  const x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  const top = y - h / 2;
  ctx.translate(x, y); ctx.rotate(rot);
  if (anim === 'slam') { const sc = lerp(1.35, 1, easeOut(clamp(u / 0.12))); ctx.scale(sc, sc); }
  ctx.translate(-x, -y);
  const din = anim === 'slam' ? 1 : easeOut(clamp(u / 0.22));
  const dout = easeInOut(prog(u, hold, hold + out));
  const L = x0 - h, R = x0 + w + h;
  ctx.beginPath(); ctx.rect(lerp(L, R, dout), top - size, (R - L) * (din - dout), h + size * 2); ctx.clip();
  ctx.globalAlpha = anim === 'slam' ? clamp(u / 0.05) : 1;
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
  slab(x0, top, w, h, bg); ctx.restore();
  slab(x0 + w - size * 0.16, top, size * 0.16, h, bg === COL.red ? COL.blue : COL.red);
  const tx = lerp(-size * 0.5, 0, easeOut(clamp((u - 0.05) / 0.25)));
  ctx.fillStyle = fg; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.fillText(s, x0 + padX + tx, y + size * 0.03);
  if (kicker) {
    const ks = Math.max(30, size * 0.3);
    ctx.font = `${ks}px ${F.ko}`; ctx.letterSpacing = `${ks * 0.12}px`;
    ctx.fillStyle = kc; ctx.textBaseline = 'alphabetic';
    const ky = top - ks * 0.45;
    ctx.fillText(kicker.toUpperCase(), x0 + 4, ky);
    const kw = ctx.measureText(kicker.toUpperCase()).width;
    ctx.fillStyle = COL.red; ctx.fillRect(x0 + kw + 22, ky - ks * 0.38, Math.min(160, w - kw - 30), 4);
  }
  ctx.restore();
}

// ---------- 字幕 ----------
function subtitles(t) {
  for (const v of TL.vo) {
    for (const c of v.chunks) {
      const a = v.t + c.a, b = v.t + c.b + (c === v.chunks[v.chunks.length - 1] ? 0.2 : 0);
      if (t < a || t >= b) continue;
      txt(c.text.replace(/[：:]/g, '  '), W / 2, 880, { size: 50, font: F.ui, stroke: 9, strokeColor: 'rgba(0,0,0,0.85)', shadow: 6 });
    }
  }
  for (const q of TL.quotes || []) {
    for (const c of q.chunks) {
      const a = q.t + c.a, b = q.t + c.b + 0.15;
      if (t < a || t >= b) continue;
      txt(c.zh.replace(/[，。；]$/, ''), W / 2, 866, { size: 50, font: F.ui, stroke: 9, strokeColor: 'rgba(0,0,0,0.85)', shadow: 6 });
      txt(c.en, W / 2, 934, { size: 30, font: F.ui, weight: 500, color: COL.light, stroke: 6, strokeColor: 'rgba(0,0,0,0.8)', shadow: 4 });
    }
  }
}

// ---------- 场景 ----------
async function sc_live(t) {
  draw(await clip('tip_live', t - S.live[0]));
  vignette(0.45);
}

async function sc_freeze(t) {
  const u = t - S.freeze[0];
  const m = MAN.tip_live;
  const im = await clip('tip_live', (m.n - 1) / FPS);
  const z = 1 + 0.12 * easeInOut(clamp(u / 3.2));
  const grey = clamp(u / 0.35) * 0.85;
  draw(im, { z, fx: 620, fy: 380, filter: `grayscale(${grey}) contrast(${1 + grey * 0.25}) brightness(${1 - grey * 0.15})` });
  vignette(0.75);
  veil(decay(t, S.freeze[0], 0.12) * 0.9, '#ffffff');
  const a = clamp((u - 0.2) / 0.3) * (1 - prog(t, S.freeze[1] - 0.3, S.freeze[1]));
  ctx.save(); ctx.globalAlpha = a;
  const e = easeOut(clamp((u - 0.2) / 0.3));
  const X = 130;
  ctx.beginPath(); ctx.rect(0, 0, X + 620 * e, H); ctx.clip();
  ctx.fillStyle = 'rgba(35,31,32,0.9)'; ctx.fillRect(X, 46, 600, 150);
  ctx.fillStyle = COL.blue; ctx.fillRect(X, 46, 600, 46);
  ctx.fillStyle = COL.red; ctx.fillRect(X, 46, 10, 150);
    ctx.restore();
  txt('NBA FINALS · GAME 4', X + 30, 71, { size: 30, font: F.ko, weight: 'normal', align: 'left', alpha: a, spacing: 3 });
  txt('第四节 剩 4.4 秒', X + 580, 70, { size: 26, font: F.hd, weight: 600, align: 'right', alpha: a, color: COL.light });
  txt('马刺', X + 30, 146, { size: 44, font: F.hd, weight: 900, align: 'left', alpha: a });
  txt('106 : 105', X + 300, 150, { size: 76, font: F.num, align: 'center', alpha: a });
  txt('尼克斯', X + 570, 146, { size: 44, font: F.hd, weight: 900, align: 'right', alpha: a });
}

async function sc_rest(t) {
  const [dx, dy] = shake(t, T.tipin, 26, 0.22);
  draw(await clip('tip_rest', t - S.rest[0]), { z: 1.03, dx, dy });
  vignette(0.45);
  veil(decay(t, T.tipin, 0.1) * 0.85, '#fff8e8');
}

async function sc_crowd(t) {
  const u = t - S.crowd[0];
  const [dx, dy] = shake(t, S.crowd[0] + 0.12, 22, 0.2);
  draw(await clip('crowd', u), { z: 1.04 + 0.05 * u / 2.5, dx, dy });
  vignette(0.55);
  huazi(t, S.crowd[0] + 0.1, '绝杀', W / 2, 470, { size: 230, bg: COL.red, kicker: 'Knicks 107  Spurs 106', anim: 'slam', rot: -0.03 });
}

function teamRow(y, name, color, score, prevScore, flipT, t, { w = 980, alpha = 1, win = false } = {}) {
  if (alpha <= 0) return;
  const x0 = W / 2 - w / 2;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.fillStyle = 'rgba(35,31,32,0.9)'; ctx.fillRect(x0, y - 70, w, 140);
  ctx.fillStyle = color; ctx.fillRect(x0, y - 70, 18, 140);
  const u = prog(t, flipT, flipT + 0.55);
  if (win && u >= 1) { ctx.fillStyle = COL.blue; ctx.fillRect(x0 + w - 330, y - 70, 330, 140); }
    ctx.restore();
  txt(name, x0 + 70, y, { size: 74, font: F.hd, weight: 900, align: 'left', alpha });
  const shown = u <= 0 ? prevScore : (u >= 1 ? score : Math.round(lerp(prevScore, score, easeOut(u))));
  ctx.save();
  if (u > 0 && u < 1) ctx.filter = 'blur(2px)';
  txt(String(shown), x0 + w - 60, y + 8, { size: 150, font: F.num, align: 'right', alpha, color: COL.white });
  ctx.restore();
}

async function sc_board(t) {
  const u = t - S.board[0];
  const bg = await clip('tip_live', 0);
  draw(bg, { z: 1.1 + 0.04 * u / 18, filter: 'blur(14px) brightness(0.45) saturate(0.6)' });
  vignette(0.8);
  veil(1 - clamp(u / 0.35));
  const flipped = t >= T.flip;
  const enter = easeOut(clamp(u / 0.5));
  const oy = (1 - enter) * 60;
  const boardFade = 1 - prog(t, T.record - 0.25, T.record);
  const ba = enter * boardFade;
  if (ba > 0) {
    ctx.save(); ctx.globalAlpha = ba;
    slab(W / 2 - 150, 222 + oy, 300, 64, flipped ? COL.red : COL.blue);
  ctx.restore();
    txt(flipped ? '终场 FINAL' : '半场 HALF', W / 2, 256 + oy, { size: 38, font: F.hd, weight: 900, alpha: ba, spacing: 4 });
  }
  teamRow(400 + oy, '马刺', COL.sas, 106, 76, T.flip, t, { alpha: ba });
  teamRow(560 + oy, '尼克斯', COL.nyk, 107, 49, T.flip, t, { alpha: ba, win: true });
  veil(decay(t, T.flip, 0.12) * 0.35, '#ffffff');
  const peak = TL.vo.find((v) => v.id === 'c02');
  const tp = peak.t + peak.chunks[2].a;
  const pa = clamp((t - tp) / 0.25) * (1 - prog(t, T.flip - 0.2, T.flip)) * boardFade;
  if (pa > 0) {
    txt('最大领先', W / 2 - 40, 712, { size: 50, font: F.hd, weight: 900, align: 'right', alpha: pa });
    txt('29', W / 2 - 10, 718, { size: 110, font: F.numW, align: 'left', alpha: pa, color: COL.red });
    txt('分', W / 2 + 120, 712, { size: 50, font: F.hd, weight: 900, align: 'left', alpha: pa });
  }

  huazi(t, T.record, '总决赛史上最大逆转', W / 2, 330, { size: 112, bg: COL.red, kicker: 'Largest comeback in NBA Finals history' });
  const ra = clamp((t - T.record24) / 0.3);
  if (ra > 0) {
    const bars = [['2008 凯尔特人', 24, COL.mid], ['2026 尼克斯', 29, COL.nyk]];
    bars.forEach(([lab, v, c], i) => {
      const y = 580 + i * 130, grow = easeOut(clamp((t - T.record24 - i * 0.35) / 0.6));
      txt(lab, 640, y, { size: 50, font: F.hd, weight: 900, align: 'right', alpha: ra });
      ctx.save(); ctx.globalAlpha = ra; slab(680, y - 38, 26 * v * grow, 76, c, -0.15); ctx.restore();
      txt(String(Math.round(v * grow)), 712 + 26 * v * grow, y + 8, { size: 100, font: F.numW, align: 'left', alpha: ra, color: i ? COL.white : COL.light });
    });
    txt('逆转分差（分）', 680, 790, { size: 30, font: F.hd, weight: 500, align: 'left', alpha: ra * 0.8, color: COL.grey });
  }
}

async function sc_inside(t) {
  const u = t - S.inside[0];
  draw(await clip('inside', u), { z: 1.02 + 0.03 * u / 4, filter: 'saturate(0.85)' });
  vignette(0.5);
  veil(1 - clamp(u / 0.2));
  ctx.save(); ctx.fillStyle = COL.blue; ctx.fillRect(130, 62, 8, 40); ctx.restore();
  txt('ESPN · INSIDE THE NBA', 154, 84, { size: 34, font: F.ko, weight: 'normal', align: 'left', alpha: 0.95, shadow: 6, spacing: 3 });
  huazi(t, T.luan, '乱投？', 1820, 330, { size: 120, bg: COL.white, fg: COL.ink, align: 'right', kicker: 'Shot selection', kc: COL.white });
  huazi(t, T.beng, '心态崩了？', 1820, 560, { size: 120, bg: COL.red, align: 'right', kicker: 'Mental collapse', kc: COL.white });
}

async function sc_stat(t) {
  const u = t - S.stat[0];
  courtBg(u);
  const e = easeOut(clamp(u / 0.5));
  ctx.save(); ctx.globalAlpha = e; ctx.fillStyle = COL.red; ctx.fillRect(160, 128, 10, 56); ctx.restore();
  txt('SAN ANTONIO · FIELD GOALS', 190, 145, { size: 30, font: F.ko, weight: 'normal', align: 'left', alpha: e, color: COL.grey, spacing: 3 });
  txt('马刺投篮', 190, 186, { size: 52, font: F.hd, weight: 900, align: 'left', alpha: e });
  const cx = [1060, 1500];
  ['上半场', '下半场'].forEach((s, i) => {
    ctx.save(); ctx.globalAlpha = e; slab(cx[i] - 150, 238, 300, 70, i ? COL.red : COL.blue); ctx.restore();
    txt(s, cx[i], 274, { size: 44, font: F.hd, weight: 900, alpha: e });
  });
  const rows = [
    [T.row_x, '按出手难度应有命中率', ['43.0%', '41.9%'], COL.light],
    [T.row_real, '实际命中率', ['59.6%', '20.5%'], COL.white],
  ];
  rows.forEach(([tr, lab, vals, c], r) => {
    const a = clamp((t - tr) / 0.3), y = 460 + r * 210;
    if (a <= 0) return;
    const sl = (1 - easeOut(a)) * 40;
    ctx.save(); ctx.globalAlpha = a * 0.5; ctx.fillStyle = COL.light; ctx.fillRect(220, y + 92, 1480, 2); ctx.restore();
    txt(lab, 800, y, { size: 44, font: F.hd, weight: 700, align: 'right', alpha: a, color: COL.grey });
    vals.forEach((v, i) => txt(v, cx[i], y + 8 + sl, { size: 140, font: F.numW, alpha: a, color: r === 1 && i === 1 ? COL.red : c }));
    if (r === 0) txt('≈', (cx[0] + cx[1]) / 2, y, { size: 80, font: F.hd, weight: 900, alpha: a, color: COL.grey });
  });
  const ar = clamp((t - T.row_real - 0.35) / 0.3);
  if (ar > 0) {
    ctx.save(); ctx.globalAlpha = ar; ctx.fillStyle = COL.red;
    const x = 1730, y = 640, h = 90 * easeOut(ar);
    ctx.fillRect(x - 12, y - 45, 24, h); ctx.beginPath(); ctx.moveTo(x - 36, y - 45 + h); ctx.lineTo(x + 36, y - 45 + h); ctx.lineTo(x, y + h); ctx.fill();
    ctx.restore();
  }
  huazi(t, T.duibushang, '对不上', 1760, 138, { size: 96, bg: COL.red, align: 'right', anim: 'slam', kicker: "Doesn't add up" });
  veil(1 - clamp(u / 0.25));
}

async function sc_title(t) {
  const u = t - S.title[0];
  const lit = t >= T.title;
  const [dx, dy] = shake(t, T.title, 24, 0.2);
  draw(await clip('top_slow', u), { z: 1.08, dx, dy, filter: lit ? 'blur(6px) brightness(0.42) saturate(0.7)' : 'brightness(0.75) saturate(0.85)' });
  vignette(0.8);
  veil(1 - clamp(u / 0.3));
  veil(decay(t, T.title, 0.12) * 0.9, '#fff6e0');
  if (lit) {
    const k = easeOut(clamp((t - T.title) / 0.25));
    ctx.save(); ctx.translate(W / 2, 420); ctx.scale(lerp(1.4, 1, k), lerp(1.4, 1, k)); ctx.translate(-W / 2, -420);
    txt('领先', 760, 440, { size: 110, font: F.hd, weight: 900, align: 'right', alpha: k, shadow: 20 });
    txt('29', 1000, 432, { size: 340, font: F.numW, alpha: k, shadow: 30 });
    ctx.save(); ctx.globalAlpha = k; slab(830, 560, 340 * easeOut(clamp((t - T.title - 0.1) / 0.3)), 16, COL.red, -1); ctx.restore();
    txt('分', 1240, 440, { size: 110, font: F.hd, weight: 900, align: 'left', alpha: k, shadow: 20 });
  ctx.restore();

// marginChart(t, g, box, { m, alpha, reveal })：g 画到比赛第几秒（0–2880）；m 0 = 小窗字号 / 1 = 全屏字号
const MG = { yMin: -10, yMax: 38, end: 2880 };
function marginChart(t, g, box, { m = 1, alpha = 1, reveal = null } = {}) {
  const X = (s) => box.x + box.w * s / MG.end;

  for (const q of [720, 1440, 2160]) { ctx.fillStyle = q === 1440 ? 'rgba(255,255,255,0.26)' : 'rgba(255,255,255,0.1)'; ctx.fillRect(X(q), box.y, q === 1440 ? 2 : 1, box.h); }
  ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fillRect(box.x, Y(0) - 1, box.w, 2);
    ctx.restore();
  for (const v of [-10, 0, 10, 20, 30]) txt(v ? signed(v) : '0', box.x - fs(10, 18), Y(v) + 2, { size: fs(18, 26), font: F.num, align: 'right', color: COL.grey, alpha: alpha * 0.85 });
  ['第一节', '第二节', '第三节', '第四节'].forEach((s, q) => txt(s, X(q * 720 + 360), box.y + box.h + fs(16, 30), { size: fs(16, 26), font: F.hd, weight: 500, color: COL.grey, alpha: alpha * 0.85 }));
  const pts = [];
  let cur = 0;
  for (const [s, a, h] of GD.margin) {
    if (s > g) break;
    pts.push([X(s), Y(cur)], [X(s), Y(a - h)]);
    cur = a - h;
  }
  pts.push([X(g), Y(cur)]);
  const line = new Path2D(), area = new Path2D();
  line.moveTo(...pts[0]); area.moveTo(X(0), Y(0));
  for (const p of pts) { line.lineTo(...p); area.lineTo(...p); }
  area.lineTo(X(g), Y(0)); area.closePath();
  const z0 = Y(0) + 3;
  for (const [y0, y1, fill, stroke] of [[box.y - 200, z0, 'rgba(196,206,212,0.2)', COL.sas], [z0, box.y + box.h + 200, 'rgba(0,107,182,0.55)', COL.nykOr]]) {

}

    ctx.beginPath(); ctx.arc(x, y, r * lerp(1.8, 1, easeOut(clamp(a))), 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.restore();
  };
  const { peaks, half, final, top } = GD.marks;
  const pa = rv(peaks[0].g);
  peaks.forEach((p) => dot(X(p.g), Y(top), fs(6, 10), COL.red, rv(p.g)));
  if (pa > 0) {
    const p0 = peaks[0];
    const mc = clamp(m * 2), mf = clamp(m * 2 - 1);
    tag(`+${top}`, X(p0.g) - 14, Y(top) - 26, { size: 22, font: F.numW, weight: 'bold', align: 'right', alpha: alpha * pa * (1 - mc) });
    if (mf > 0) {
      const xs = peaks.map((p) => X(p.g)), cx = (xs[0] + xs[xs.length - 1]) / 2, cy = Y(top) - 76;
      ctx.save(); ctx.strokeStyle = COL.red; ctx.lineWidth = 2;
      peaks.forEach((p, i) => { const a = rv(p.g); if (a <= 0) return; ctx.globalAlpha = alpha * mf * a; ctx.beginPath(); ctx.moveTo(cx, cy + 22); ctx.lineTo(xs[i], Y(top) - 12); ctx.stroke(); });
  ctx.restore();
      const w = tag(`最大领先 +${top}`, cx, cy, { size: 34, alpha: alpha * mf * pa });
      const sub = peaks.filter((p) => rv(p.g) > 0).map((p) => `${p.label}（${p.sas}:${p.nyk}）`).join(' · ');
      txt(sub, cx + w / 2 + 26, cy + 2, { size: 24, font: F.hd, weight: 500, align: 'left', color: COL.grey, alpha: alpha * mf * pa });

    txt(`${half[1]}:${half[2]}`, x, y + 134, { size: 30, font: F.num, color: COL.grey, alpha: alpha * ha });

}
// 分段驱动的比赛时间：segs = [[t0, t1, g0, g1], ...]，段内 easeInOut；返回 g(t) 和反查 tOf(g)
function gameClock(segs) {
  const g = (t) => {
    let v = segs[0][2];
    for (const [a, b, g0, g1] of segs) { if (t >= a) v = lerp(g0, g1, easeInOut(prog(t, a, b))); }
    return v;
  };
  const tOf = (gm) => {
    const seg = segs.find(([, , g0, g1]) => gm >= g0 && gm <= g1) || segs[segs.length - 1];
    let lo = seg[0], hi = seg[1];
    for (let i = 0; i < 30; i++) { const mid = (lo + hi) / 2; if (g(mid) >= gm) hi = mid; else lo = mid; }
    return hi;
  };
  return { g, tOf };
}

const XB = { base: 690, k: 340 / 70, bw: 170, gap: 28 };
function xbarGroup(t, gr) {

  const bar = (x, v, g, c) => { if (g <= 0) return; ctx.fillStyle = c; ctx.fillRect(x, Yv(v * g), XB.bw, v * g * XB.k); };

  if (gr2 > 0) txt(String(Math.round(pts * gr2)), xr + XB.bw / 2, Yv(pts * gr2) - 40, { size: 76, font: F.numW, color: realColor === COL.red ? COL.red : COL.white });
  const da = easeOut(prog(t, tDiff, tDiff + 0.4));

  runs([[val, { size: 170, font: F.numW }], ['秒', { size: 48, font: F.hd, weight: 900, color: COL.grey }]], x + w / 2, y + 190, { alpha: e, gap: 10 });
}
function ov_dual(t, ov) {
  const out = 1 - easeInOut(prog(t, ov.b - 0.35, ov.b));
  clockCard(t, ov.tl, 200, '比赛剩余', 'GAME CLOCK', '13.0', COL.blue, out);
  clockCard(t, ov.tr, 1160, '进攻时钟', 'SHOT CLOCK', '24', COL.red, out);
  const ga = easeOut(prog(t, ov.tgt, ov.tgt + 0.3)) * out;
  if (ga > 0) {
    txt('>', W / 2 + 40, 330, { size: 150, font: F.numW, color: COL.red, alpha: ga });
    tag('进攻时间比比赛剩余时间还多', W / 2 + 40, 500, { size: 34, bg: COL.red, alpha: ga });
  }
  const na = easeOut(prog(t, ov.tno, ov.tno + 0.3)) * out;
  if (na > 0) {
    tag('不存在进攻超时', W / 2 + 40, 570, { size: 34, bg: COL.ink, alpha: na });
  }
  const ba = easeOut(prog(t, ov.tl, ov.tl + 0.3)) * out;
  if (ba > 0) {
    ctx.save(); ctx.globalAlpha = ba * (0.7 + 0.3 * Math.sin(t * 6)); ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 5;
    ctx.strokeRect(1238, 940, 196, 60); ctx.restore();
  }
}
// 拆③ s4_18–19：持球流程图，节点按旁白逐个亮起
function ov_flow(t, ov) {
  const out = 1 - easeInOut(prog(t, ov.b - 0.35, ov.b));
  veil(easeOut(prog(t, ov.a, ov.a + 0.4)) * 0.35 * out);
  const e0 = easeOut(prog(t, ov.a, ov.a + 0.4)) * out;
  tag('这球该怎么打', 200, 150, { size: 40, bg: COL.blue, align: 'left', alpha: e0 });
  const n = ov.nodes.length, w = 360, gap = 70, x0 = (W - (n * w + (n - 1) * gap)) / 2, y = 300;
  ov.nodes.forEach(([head, sub], i) => {
    const e = easeOut(prog(t, ov.keys[i], ov.keys[i] + 0.35)) * out;
    if (e <= 0) return;
    const x = x0 + i * (w + gap);
    ctx.save(); ctx.globalAlpha = e; ctx.translate(0, (1 - e) * 24);
    ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 22;
    ctx.fillStyle = 'rgba(35,31,32,0.94)'; ctx.fillRect(x, y, w, 170); ctx.shadowBlur = 0;
    ctx.fillStyle = i === n - 1 ? COL.red : COL.blue; ctx.fillRect(x, y, 10, 170);
    if (i > 0) {
      ctx.fillStyle = COL.white; const ax = x - gap + 12, ay = y + 85;
      ctx.fillRect(ax, ay - 3, gap - 34, 6); ctx.beginPath(); ctx.moveTo(x - 8, ay); ctx.lineTo(x - 26, ay - 14); ctx.lineTo(x - 26, ay + 14); ctx.fill();
    }
    ctx.restore();
    txt(head, x + 34, y + 62, { size: 40, font: F.hd, weight: 900, align: 'left', alpha: e });
    txt(sub, x + 34, y + 118, { size: 28, font: F.hd, weight: 500, align: 'left', color: COL.grey, alpha: e });
  });
}
const SH = { clip: sh_clip, quote: sh_quote, board: sh_board, mfull: sh_mfull, fgcard: sh_fgcard, xbars: sh_xbars, shotmix: sh_shotmix,
  defdist: sh_defdist, tl13: sh_tl13, summary: sh_summary, end: sh_end, black: sh_black };
const OV = { mcorner: ov_mcorner, score: ov_score, run: ov_run, fpts: ov_fpts, huazi: ov_huazi, chapter: ov_chapter, dual: ov_dual, flow: ov_flow, shotcard: ov_shotcard };
const off = mk(W, H), offCtx = off.getContext('2d');
async function renderShot(sh, t) { ctx.save(); await SH[sh.sc](t, sh); ctx.restore(); }

window.renderFrame = async (t) => {
  const f = Math.round(t * FPS);
  ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  for (const [name, [a, b]] of Object.entries(S)) {
    if (t >= a && t < b) { ctx.save(); await SCENES[name](t, f); ctx.restore(); break; }
  }
  const shots = TL.shots || [];
  const k = shots.findIndex((s) => t >= s.a && t < s.b);
  if (k >= 0) {
    const cur = shots[k], prev = shots[k - 1];
    if (cur.xin && prev && t < cur.a + cur.xin) {
      const main = ctx;
      ctx = offCtx; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
      await renderShot(prev, t);
      ctx = main;
      await renderShot(cur, t);
      ctx.save(); ctx.globalAlpha = 1 - easeInOut((t - cur.a) / cur.xin); ctx.drawImage(off, 0, 0); ctx.restore();
    } else {
      await renderShot(cur, t);
    }
  }
  for (const ov of TL.ov || []) {
    if (t >= ov.a && t < ov.b) { ctx.save(); OV[ov.type](t, ov); ctx.restore(); }
  }
  subtitles(t);
  if (LOGO) {
    const lh = 96, lw = lh * LOGO.width / LOGO.height;
    ctx.save(); ctx.globalAlpha = 0.92; ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 2;
    ctx.imageSmoothingQuality = 'high'; ctx.drawImage(LOGO, 56, 46, lw, lh); ctx.restore();
  }
  const g = grain[f % 4], ox = -Math.floor(hash(f, 21) * 512), oy = -Math.floor(hash(f, 22) * 512);
  for (let x = ox; x < W; x += 512) for (let y = oy; y < H; y += 512) ctx.drawImage(g, x, y);
};

window.ready = (async () => {
  TL = await (await fetch(`film_${MODE}.json`)).json();
  T = TL.T; S = TL.scenes;
  MAN = await (await fetch('clips/manifest.json')).json();
  GD = await (await fetch('gfx_data.json')).json();
  window.DURATION = TL.duration;
  window.FPS = FPS;
  LOGO = await loadImg('../assets/logoman.png');
  const noto = new FontFace('NotoSansSC', 'url(../assets/fonts/NotoSansSC.ttf)', { weight: '100 900' });
  document.fonts.add(await noto.load());
  await Promise.all([
    ...[500, 700, 900].map((w) => document.fonts.load(`${w} 100px ${F.hd}`, '马刺尼克斯')),
    document.fonts.load(`bold 100px ${F.num}`), document.fonts.load(`bold 100px ${F.numW}`), document.fonts.load(`100px ${F.ko}`),
  ]);})();
</script>
