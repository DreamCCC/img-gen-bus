<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// W / H：横版画布尺寸；竖版（?m=vt）里横版绘制函数仍按 1920×1080 画，竖版自己的函数用 VW / VH
let W = 1920, H = 1080;
const FPS = 30;
const MODE = new URLSearchParams(location.search).get('m') || 'h';
// 英文版（&lang=en）：时间线 film_<mode>_en.json，素材帧用 en_ 前缀的片段，画面文字走 L(中文, 英文)
const EN = new URLSearchParams(location.search).get('lang') === 'en';
const L = (zh, en) => (EN ? en : zh);
const ck = (name) => (EN ? 'en_' + name : name);
const QN = { 第一节: 'Q1', 第二节: 'Q2', 第三节: 'Q3', 第四节: 'Q4' };
const qlab = (s) => (EN ? s.replace(/第[一二三四]节/, (m) => QN[m]) : s);
const mk = (w, h) => Object.assign(document.createElement('canvas'), { width: w, height: h });
const cv = document.getElementById('c');
let ctx = cv.getContext('2d');

const COL = {
  bg: '#231f20', ink: '#231f20', blue: '#1d428a', red: '#c8102e', white: '#ffffff', grey: '#c3ced3',
  mid: '#7f7f7f', light: '#d5d9dd', sas: '#c4ced4', nyk: '#006bb6', nykOr: '#f58426',
};
const F = {
  ui: '"PingFang SC", sans-serif',
  hd: '"NotoSansSC", "PingFang SC", sans-serif',
  num: '"Action NBA Condensed", "DIN Condensed", sans-serif',
  numW: '"Action NBA", "Action NBA Condensed", sans-serif',
  ko: '"Knockout", "Action NBA Condensed", sans-serif',
};
const SKEW = -0.21;

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const hash = (a, b = 0) => { const s = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453; return s - Math.floor(s); };
const pad = (k) => String(k).padStart(5, '0');
const decay = (t, t0, tau) => (t >= t0 ? Math.exp(-(t - t0) / tau) : 0);

const signed = (v) => (v > 0 ? `+${v}` : String(v));

let TL, T, S, GD = null, MAN = {}, LOGO = null;

// ---------- 素材帧 ----------
const imgCache = new Map();
function loadImg(src) {
  if (!imgCache.has(src)) {
    const im = new Image();
    im.src = src;
    imgCache.set(src, im.decode().then(() => im).catch(() => null));
    if (imgCache.size > 48) imgCache.delete(imgCache.keys().next().value);
  }
  return imgCache.get(src);
}
async function clip(name, lt) {
  name = ck(name);
  const m = MAN[name];
  if (!m) return null;
  const k = clamp(Math.floor(lt * FPS + 1e-4), 0, m.n - 1);
  if (k + 1 < m.n) loadImg(`clips/${name}/${pad(k + 1)}.jpg`);
  return loadImg(`clips/${name}/${pad(k)}.jpg`);
}
function draw(im, { z = 1, fx = W / 2, fy = H / 2, filter = 'none', alpha = 1, dx = 0, dy = 0 } = {}) {
  if (!im) return;
  ctx.save();
  ctx.globalAlpha = alpha; ctx.filter = filter;
  ctx.translate(fx + dx, fy + dy); ctx.scale(z, z); ctx.translate(-fx, -fy);
  ctx.drawImage(im, 0, 0, W, H);
  ctx.restore();
}

// ---------- 颗粒与暗角 ----------
const grain = [];
  for (let k = 0; k < 4; k++) {
  const g = mk(512, 512), gx = g.getContext('2d'), id = gx.createImageData(512, 512);
  for (let i = 0; i < id.data.length; i += 4) { const v = hash(i, k) * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 14; }
  gx.putImageData(id, 0, 0); grain.push(g);
}
function vignette(a) {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 1.0);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function veil(a, color = '#000') { if (a <= 0) return; ctx.save(); ctx.globalAlpha = clamp(a); ctx.fillStyle = color; ctx.fillRect(0, 0, W, H); ctx.restore(); }
function shake(t, t0, amp = 18, tau = 0.18) {
  const d = decay(t, t0, tau) * amp;
  return [Math.sin(t * 97) * d, Math.cos(t * 83) * d * 0.7];
}

// ---------- 文字 ----------
// 英文版：F.hd 粗体（≥700）换 Knockout 大写、字号放大 12%，细体换 PingFang 的拉丁字形
function enFont(s, size, font, weight) {
  if (!EN || font !== F.hd) return [s, size, font, weight];
  const w = weight === 'bold' ? 700 : Number(weight);
  return w >= 700 ? [String(s).toUpperCase(), size * 1.12, F.ko, 'normal'] : [s, size, F.ui, weight];
}
function txt(s, x, y, { size = 48, font = F.ui, weight = 'bold', color = COL.white, align = 'center', alpha = 1, base = 'middle', stroke = 0, strokeColor = '#000', shadow = 0, spacing = 0 } = {}) {
  if (alpha <= 0) return;
  [s, size, font, weight] = enFont(s, size, font, weight);
  ctx.save();
  ctx.globalAlpha = clamp(alpha);
  ctx.font = `${weight} ${size}px ${font}`;
  ctx.textAlign = align; ctx.textBaseline = base;
  if (spacing) ctx.letterSpacing = `${spacing}px`;
  if (shadow) { ctx.shadowColor = 'rgba(0,0,0,0.75)'; ctx.shadowBlur = shadow; ctx.shadowOffsetY = shadow * 0.25; }
  if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = stroke; ctx.strokeStyle = strokeColor; ctx.strokeText(s, x, y); ctx.shadowColor = 'transparent'; }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
  ctx.restore();
}
function measure(s, { size = 48, font = F.ui, weight = 'bold', spacing = 0 } = {}) {
  [s, size, font, weight] = enFont(s, size, font, weight);
  ctx.save(); ctx.font = `${weight} ${size}px ${font}`; if (spacing) ctx.letterSpacing = `${spacing}px`;
  const w = ctx.measureText(s).width; ctx.restore(); return w;
}
// 一行多段不同字体的文字，整体按 align 对齐；parts: [[文字, txt 选项], ...]
function runs(parts, x, y, { align = 'center', alpha = 1, gap = 0 } = {}) {
  const ws = parts.map(([s, o]) => measure(s, o));
  const total = ws.reduce((a, b) => a + b, 0) + gap * (parts.length - 1);
  let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  parts.forEach(([s, o], i) => { txt(s, cx, y, { ...o, align: 'left', alpha: alpha * (o.alpha ?? 1) }); cx += ws[i] + gap; });
}
function slab(x, y, w, h, color, skew = SKEW) {
  const k = h * skew / 2;
  ctx.beginPath();
  ctx.moveTo(x - k, y); ctx.lineTo(x + w - k, y); ctx.lineTo(x + w + k, y + h); ctx.lineTo(x + k, y + h);
  ctx.closePath(); ctx.fillStyle = color; ctx.fill();
}
// 斜切色块 + 居中文字的小标签
function tag(s, cx, cy, { size = 34, bg = COL.red, fg = COL.white, font = F.hd, weight = 900, alpha = 1, align = 'center', padX = 0.55 } = {}) {
  if (alpha <= 0) return 0;
  const w = measure(s, { size, font, weight }) + size * padX * 2, h = size * 1.5;
  const x0 = align === 'center' ? cx - w / 2 : align === 'right' ? cx - w : cx;
  ctx.save(); ctx.globalAlpha = clamp(alpha); slab(x0, cy - h / 2, w, h, bg); ctx.restore();
  txt(s, x0 + w / 2, cy + size * 0.04, { size, font, weight, color: fg, alpha });
  return w;
}

// orb=false：去掉右下蓝色大圆，给需要整幅宽度的图表用
function courtBg(u, { orb = true } = {}) {
  ctx.fillStyle = COL.ink; ctx.fillRect(0, 0, W, H);
  const d = easeOut(clamp(u / 0.8));
  ctx.save();
  if (orb) {
    ctx.fillStyle = COL.blue; ctx.beginPath(); ctx.arc(W + 900, H + 400, 1500, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 12;
    ctx.beginPath(); ctx.arc(W + 900, H + 400, 1530, Math.PI, Math.PI + 0.9 * d); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 10;
  ctx.beginPath(); ctx.arc(560, -380, 640, 0.15, Math.PI - 0.15); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = 'rgba(35,31,32,0.55)'; ctx.fillRect(0, 0, W, H);
}

// 花字（NBA 图文风格）：斜切色块从左擦入，白字跟进；kicker 为英文小标
// anim: wipe 擦入 / slam 砸入
function huazi(t, t0, s, x, y, { size = 120, bg = COL.red, fg = COL.white, kicker = '', kc = COL.white, anim = 'wipe', align = 'center', hold = 99, out = 0.22, rot = 0 } = {}) {
  const u = t - t0;
  if (u < 0 || u > hold + out) return;
  ctx.save();
  const [hs, hz, hf, hw] = enFont(s, size, F.hd, 900);
  s = hs;
  ctx.font = `${hw} ${hz}px ${hf}`;
  const tw = ctx.measureText(s).width;
  const padX = size * 0.42, h = size * 1.32, w = tw + padX * 2;
  const x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  const top = y - h / 2;
  ctx.translate(x, y); ctx.rotate(rot);
  if (anim === 'slam') { const sc = lerp(1.35, 1, easeOut(clamp(u / 0.12))); ctx.scale(sc, sc); }
  ctx.translate(-x, -y);
  const din = anim === 'slam' ? 1 : easeOut(clamp(u / 0.22));
  const dout = easeInOut(prog(u, hold, hold + out));
  const L = x0 - h, R = x0 + w + h;
  ctx.beginPath(); ctx.rect(lerp(L, R, dout), top - size, (R - L) * (din - dout), h + size * 2); ctx.clip();
  ctx.globalAlpha = anim === 'slam' ? clamp(u / 0.05) : 1;
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
  slab(x0, top, w, h, bg); ctx.restore();
  slab(x0 + w - size * 0.16, top, size * 0.16, h, bg === COL.red ? COL.blue : COL.red);
  const tx = lerp(-size * 0.5, 0, easeOut(clamp((u - 0.05) / 0.25)));
  ctx.fillStyle = fg; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.fillText(s, x0 + padX + tx, y + size * 0.03);
  if (kicker) {
    const ks = Math.max(30, size * 0.3);
    ctx.font = `${ks}px ${F.ko}`; ctx.letterSpacing = `${ks * 0.12}px`;
    ctx.fillStyle = kc; ctx.textBaseline = 'alphabetic';
    const ky = top - ks * 0.45;
    ctx.fillText(kicker.toUpperCase(), x0 + 4, ky);
    const kw = ctx.measureText(kicker.toUpperCase()).width;
    ctx.fillStyle = COL.red; ctx.fillRect(x0 + kw + 22, ky - ks * 0.38, Math.min(160, w - kw - 30), 4);
  }
  ctx.restore();
}

// ---------- 字幕 ----------
function subtitles(t) {
  for (const v of TL.vo) {
    for (const c of v.chunks) {
      const a = v.t + c.a, b = v.t + c.b + (c === v.chunks[v.chunks.length - 1] ? 0.2 : 0);
      if (t < a || t >= b) continue;
      txt(EN ? c.text : c.text.replace(/[：:]/g, '  '), W / 2, 880, { size: 50, font: F.ui, stroke: 9, strokeColor: 'rgba(0,0,0,0.85)', shadow: 6 });
    }
  }
  for (const q of TL.quotes || []) {
    for (const c of q.chunks) {
      const a = q.t + c.a, b = q.t + c.b + 0.15;
      if (t < a || t >= b) continue;
      if (EN) { txt(c.en, W / 2, 880, { size: 50, font: F.ui, stroke: 9, strokeColor: 'rgba(0,0,0,0.85)', shadow: 6 }); continue; }
      txt(c.zh.replace(/[，。；]$/, ''), W / 2, 866, { size: 50, font: F.ui, stroke: 9, strokeColor: 'rgba(0,0,0,0.85)', shadow: 6 });
      txt(c.en, W / 2, 934, { size: 30, font: F.ui, weight: 500, color: COL.light, stroke: 6, strokeColor: 'rgba(0,0,0,0.8)', shadow: 4 });
    }
  }
}

// ---------- 场景 ----------
async function sc_live(t) {
  draw(await clip('tip_live', t - S.live[0]));
  vignette(0.45);
}

async function sc_freeze(t) {
  const u = t - S.freeze[0];
  const m = MAN[ck('tip_live')];
  const im = await clip('tip_live', (m.n - 1) / FPS);
  const z = 1 + 0.12 * easeInOut(clamp(u / 3.2));
  const grey = clamp(u / 0.35) * 0.85;
  draw(im, { z, fx: 620, fy: 380, filter: `grayscale(${grey}) contrast(${1 + grey * 0.25}) brightness(${1 - grey * 0.15})` });
  vignette(0.75);
  veil(decay(t, S.freeze[0], 0.12) * 0.9, '#ffffff');
  const a = clamp((u - 0.2) / 0.3) * (1 - prog(t, S.freeze[1] - 0.3, S.freeze[1]));
  ctx.save(); ctx.globalAlpha = a;
  const e = easeOut(clamp((u - 0.2) / 0.3));
  const X = 130;
  ctx.beginPath(); ctx.rect(0, 0, X + 620 * e, H); ctx.clip();
  ctx.fillStyle = 'rgba(35,31,32,0.9)'; ctx.fillRect(X, 46, 600, 150);
  ctx.fillStyle = COL.blue; ctx.fillRect(X, 46, 600, 46);
  ctx.fillStyle = COL.red; ctx.fillRect(X, 46, 10, 150);
    ctx.restore();
  txt('NBA FINALS · GAME 4', X + 30, 71, { size: 30, font: F.ko, weight: 'normal', align: 'left', alpha: a, spacing: 3 });
  txt(L('第四节 剩 4.4 秒', 'Q4 · 4.4 LEFT'), X + 580, 70, { size: 26, font: F.hd, weight: 600, align: 'right', alpha: a, color: COL.light });
  txt(L('马刺', 'SPURS'), X + 30, 146, { size: 44, font: F.hd, weight: 900, align: 'left', alpha: a });
  txt('106 : 105', X + 300, 150, { size: 76, font: F.num, align: 'center', alpha: a });
  txt(L('尼克斯', 'KNICKS'), X + 570, 146, { size: 44, font: F.hd, weight: 900, align: 'right', alpha: a });
}

async function sc_rest(t) {
  const [dx, dy] = shake(t, T.tipin, 26, 0.22);
  draw(await clip('tip_rest', t - S.rest[0]), { z: 1.03, dx, dy });
  vignette(0.45);
  veil(decay(t, T.tipin, 0.1) * 0.85, '#fff8e8');
}

async function sc_crowd(t) {
  const u = t - S.crowd[0];
  const [dx, dy] = shake(t, S.crowd[0] + 0.12, 22, 0.2);
  draw(await clip('crowd', u), { z: 1.04 + 0.05 * u / 2.5, dx, dy });
  vignette(0.55);
  huazi(t, S.crowd[0] + 0.1, L('绝杀', 'GAME-WINNER'), W / 2, 470, { size: 230, bg: COL.red, kicker: 'Knicks 107  Spurs 106', anim: 'slam', rot: -0.03 });
}

function teamRow(y, name, color, score, prevScore, flipT, t, { w = 980, alpha = 1, win = false } = {}) {
  if (alpha <= 0) return;
  const x0 = W / 2 - w / 2;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.fillStyle = 'rgba(35,31,32,0.9)'; ctx.fillRect(x0, y - 70, w, 140);
  ctx.fillStyle = color; ctx.fillRect(x0, y - 70, 18, 140);
  const u = prog(t, flipT, flipT + 0.55);
  if (win && u >= 1) { ctx.fillStyle = COL.blue; ctx.fillRect(x0 + w - 330, y - 70, 330, 140); }
    ctx.restore();
  txt(name, x0 + 70, y, { size: 74, font: F.hd, weight: 900, align: 'left', alpha });
  const shown = u <= 0 ? prevScore : (u >= 1 ? score : Math.round(lerp(prevScore, score, easeOut(u))));
  ctx.save();
  if (u > 0 && u < 1) ctx.filter = 'blur(2px)';
  txt(String(shown), x0 + w - 60, y + 8, { size: 150, font: F.num, align: 'right', alpha, color: COL.white });
  ctx.restore();
}

async function sc_board(t) {
  const u = t - S.board[0];
  const bg = await clip('tip_live', 0);
  draw(bg, { z: 1.1 + 0.04 * u / 18, filter: 'blur(14px) brightness(0.45) saturate(0.6)' });
  vignette(0.8);
  veil(1 - clamp(u / 0.35));
  const flipped = t >= T.flip;
  const enter = easeOut(clamp(u / 0.5));
  const oy = (1 - enter) * 60;
  const boardFade = 1 - prog(t, T.record - 0.25, T.record);
  const ba = enter * boardFade;
  if (ba > 0) {
    ctx.save(); ctx.globalAlpha = ba;
    slab(W / 2 - 150, 222 + oy, 300, 64, flipped ? COL.red : COL.blue);
  ctx.restore();
    txt(flipped ? L('终场 FINAL', 'FINAL') : L('半场 HALF', 'HALFTIME'), W / 2, 256 + oy, { size: 38, font: F.hd, weight: 900, alpha: ba, spacing: 4 });
  }
  teamRow(400 + oy, L('马刺', 'SPURS'), COL.sas, 106, 76, T.flip, t, { alpha: ba });
  teamRow(560 + oy, L('尼克斯', 'KNICKS'), COL.nyk, 107, 49, T.flip, t, { alpha: ba, win: true });
  veil(decay(t, T.flip, 0.12) * 0.35, '#ffffff');
  const peak = TL.vo.find((v) => v.id === 'c02');
  const tp = T.peak ?? peak.t + peak.chunks[2].a;
  const pa = clamp((t - tp) / 0.25) * (1 - prog(t, T.flip - 0.2, T.flip)) * boardFade;
  if (pa > 0) {
    txt(L('最大领先', 'LARGEST LEAD'), W / 2 - 40, 712, { size: 50, font: F.hd, weight: 900, align: 'right', alpha: pa });
    txt('29', W / 2 - 10, 718, { size: 110, font: F.numW, align: 'left', alpha: pa, color: COL.red });
    txt(L('分', ''), W / 2 + 120, 712, { size: 50, font: F.hd, weight: 900, align: 'left', alpha: pa });
  }

  huazi(t, T.record, L('总决赛史上最大逆转', 'LARGEST COMEBACK IN FINALS HISTORY'), W / 2, 330, { size: EN ? 96 : 112, bg: COL.red, kicker: L('Largest comeback in NBA Finals history', 'NBA Finals record') });
  const ra = clamp((t - T.record24) / 0.3);
  if (ra > 0) {
    const bars = [[L('2008 凯尔特人', '2008 CELTICS'), 24, COL.mid], [L('2026 尼克斯', '2026 KNICKS'), 29, COL.nyk]];
    bars.forEach(([lab, v, c], i) => {
      const y = 580 + i * 130, grow = easeOut(clamp((t - T.record24 - i * 0.35) / 0.6));
      txt(lab, 640, y, { size: 50, font: F.hd, weight: 900, align: 'right', alpha: ra });
      ctx.save(); ctx.globalAlpha = ra; slab(680, y - 38, 26 * v * grow, 76, c, -0.15); ctx.restore();
      txt(String(Math.round(v * grow)), 712 + 26 * v * grow, y + 8, { size: 100, font: F.numW, align: 'left', alpha: ra, color: i ? COL.white : COL.light });
    });
    txt(L('逆转分差（分）', 'Deficit overcome (points)'), 680, 790, { size: 30, font: F.hd, weight: 500, align: 'left', alpha: ra * 0.8, color: COL.grey });
  }
}

async function sc_inside(t) {
  const u = t - S.inside[0];
  draw(await clip('inside', u), { z: 1.02 + 0.03 * u / 4, filter: 'saturate(0.85)' });
  vignette(0.5);
  veil(1 - clamp(u / 0.2));
  ctx.save(); ctx.fillStyle = COL.blue; ctx.fillRect(130, 62, 8, 40); ctx.restore();
  txt('ESPN · INSIDE THE NBA', 154, 84, { size: 34, font: F.ko, weight: 'normal', align: 'left', alpha: 0.95, shadow: 6, spacing: 3 });
  huazi(t, T.luan, L('乱投？', 'BAD SHOTS?'), 1820, 330, { size: 120, bg: COL.white, fg: COL.ink, align: 'right', kicker: 'Shot selection', kc: COL.white });
  huazi(t, T.beng, L('心态崩了？', 'MELTDOWN?'), 1820, 560, { size: 120, bg: COL.red, align: 'right', kicker: 'Mental collapse', kc: COL.white });
}

async function sc_stat(t) {
  const u = t - S.stat[0];
  courtBg(u);
  const e = easeOut(clamp(u / 0.5));
  ctx.save(); ctx.globalAlpha = e; ctx.fillStyle = COL.red; ctx.fillRect(160, 128, 10, 56); ctx.restore();
  txt('SAN ANTONIO · FIELD GOALS', 190, 145, { size: 30, font: F.ko, weight: 'normal', align: 'left', alpha: e, color: COL.grey, spacing: 3 });
  txt(L('马刺投篮', 'SPURS SHOOTING'), 190, 186, { size: 52, font: F.hd, weight: 900, align: 'left', alpha: e });
  const cx = [1060, 1500];
  [L('上半场', '1ST HALF'), L('下半场', '2ND HALF')].forEach((s, i) => {
    ctx.save(); ctx.globalAlpha = e; slab(cx[i] - 150, 238, 300, 70, i ? COL.red : COL.blue); ctx.restore();
    txt(s, cx[i], 274, { size: 44, font: F.hd, weight: 900, alpha: e });
  });
  const rows = [
    [T.row_x, L('按出手难度应有命中率', 'Expected FG% by shot difficulty'), ['43.0%', '41.9%'], COL.light],
    [T.row_real, L('实际命中率', 'Actual FG%'), ['59.6%', '20.5%'], COL.white],
  ];
  rows.forEach(([tr, lab, vals, c], r) => {
    const a = clamp((t - tr) / 0.3), y = 460 + r * 210;
    if (a <= 0) return;
    const sl = (1 - easeOut(a)) * 40;
    ctx.save(); ctx.globalAlpha = a * 0.5; ctx.fillStyle = COL.light; ctx.fillRect(220, y + 92, 1480, 2); ctx.restore();
    txt(lab, 800, y, { size: 44, font: F.hd, weight: 700, align: 'right', alpha: a, color: COL.grey });

// marginChart(t, g, box, { m, alpha, reveal })：g 画到比赛第几秒（0–2880）；m 0 = 小窗字号 / 1 = 全屏字号
const MG = { yMin: -10, yMax: 38, end: 2880 };
function marginChart(t, g, box, { m = 1, alpha = 1, reveal = null, peakSub = true } = {}) {
  const X = (s) => box.x + box.w * s / MG.end;

  ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fillRect(box.x, Y(0) - 1, box.w, 2);
    ctx.restore();
  for (const v of [-10, 0, 10, 20, 30]) txt(v ? signed(v) : '0', box.x - fs(10, 18), Y(v) + 2, { size: fs(18, 26), font: F.num, align: 'right', color: COL.grey, alpha: alpha * 0.85 });

  const pts = [];

}

  if (pa > 0) {

    if (mf > 0) {
      const xs = peaks.map((p) => X(p.g)), cx = (xs[0] + xs[xs.length - 1]) / 2, cy = Y(top) - 76;
      ctx.save(); ctx.strokeStyle = COL.red; ctx.lineWidth = 2;
      peaks.forEach((p, i) => { const a = rv(p.g); if (a <= 0) return; ctx.globalAlpha = alpha * mf * a; ctx.beginPath(); ctx.moveTo(cx, cy + 22); ctx.lineTo(xs[i], Y(top) - 12); ctx.stroke(); });
  ctx.restore();
      const w = tag(`${L('最大领先', 'LARGEST LEAD')} +${top}`, cx, cy, { size: 34, alpha: alpha * mf * pa });
      const sub = peaks.filter((p) => rv(p.g) > 0).map((p) => (EN ? `${qlab(p.label)} (${p.sas}-${p.nyk})` : `${p.label}（${p.sas}:${p.nyk}）`)).join(' · ');

    txt(`${half[1]}:${half[2]}`, x, y + 134, { size: 30, font: F.num, color: COL.grey, alpha: alpha * ha });

}
// 分段驱动的比赛时间：segs = [[t0, t1, g0, g1], ...]，段内 easeInOut；返回 g(t) 和反查 tOf(g)
function gameClock(segs) {
  const g = (t) => {
    let v = segs[0][2];
    for (const [a, b, g0, g1] of segs) { if (t >= a) v = lerp(g0, g1, easeInOut(prog(t, a, b))); }
    return v;
  };
  const tOf = (gm) => {
    const seg = segs.find(([, , g0, g1]) => gm >= g0 && gm <= g1) || segs[segs.length - 1];
    let lo = seg[0], hi = seg[1];
    for (let i = 0; i < 30; i++) { const mid = (lo + hi) / 2; if (g(mid) >= gm) hi = mid; else lo = mid; }
    return hi;
  };
  return { g, tOf };
}

function mixRow(t, t0, y, q, label, { dim = 1, hl = null, tHl = 99, hls = null } = {}) {

  const e = easeOut(prog(t, t0, t0 + 0.7));

  const x0 = 430, bw = 1330, bh = 96;
  txt(label, 330, y + bh / 2, { size: 42, font: F.hd, weight: 900, align: 'right', alpha: clamp((t - t0) / 0.3) * dim });

  let x = x0;
  for (const k of ['three', 'mid', 'rim']) {
    const n = Q[k], w = bw * n / Q.fga * e;

    ctx.fillStyle = c; ctx.fillRect(x, y, Math.max(0, w - 4), bh);

  ctx.restore();
    const ta = clamp((t - t0 - 0.5) / 0.3) * dim;
    if (w > 150) {

      txt(`${Math.round(n / Q.fga * 100)}%`, x + w - 22, y + bh / 2 + 4, { size: 50, font: F.numW, align: 'right', alpha: ta });
    }

}

// 应得 / 实得：柱子竖排，差值标在实得柱右侧
function xbarGroupV(t, g) {
  const { cx, bw, k, base, label, slabColor, xp, pts, tExp, tReal, tDiff, realColor, diffNote } = g;
  const Yv = (v) => base - v * k;
  const gap = 24, xe = cx - gap / 2 - bw, xr = cx + gap / 2;
  const ge = easeOut(prog(t, tExp, tExp + 0.6)), gr2 = easeOut(prog(t, tReal, tReal + 0.8));
  const la = clamp((t - tExp) / 0.3);
  if (la <= 0) return;
  txt(L('应得', 'EXP.'), xe + bw / 2, base + 30, { size: 30, font: F.hd, weight: 700, color: COL.grey, alpha: la });
  txt(L('实得', 'ACTUAL'), xr + bw / 2, base + 30, { size: 30, font: F.hd, weight: 700, alpha: clamp((t - tReal) / 0.3) });
  ctx.save(); ctx.globalAlpha = la; slab(cx - 120, base + 62, 240, 60, slabColor); ctx.restore();
  txt(label, cx, base + 93, { size: 38, font: F.hd, weight: 900, alpha: la });
  const bar = (x, v, gg, c) => { if (gg <= 0) return; ctx.fillStyle = c; ctx.fillRect(x, Yv(v * gg), bw, v * gg * k); };
  bar(xe, xp, ge, COL.mid);
  bar(xr, pts, gr2, realColor);
  if (ge > 0) txt(String(Math.round(Math.round(xp) * ge)), xe + bw / 2, Yv(xp * ge) - 40, { size: 76, font: F.numW, color: COL.light });
  if (gr2 > 0) txt(String(Math.round(pts * gr2)), xr + bw / 2, Yv(pts * gr2) - 40, { size: 76, font: F.numW, color: realColor === COL.red ? COL.red : COL.white });
  const da = easeOut(prog(t, tDiff, tDiff + 0.4));
  if (da <= 0) return;
  const d = Math.round(pts - xp), hiV = Math.max(xp, pts), loV = Math.min(xp, pts);
  ctx.save(); ctx.globalAlpha = da;
  ctx.setLineDash([10, 8]); ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,0.75)';
  ctx.beginPath(); ctx.moveTo(xe, Yv(xp)); ctx.lineTo(xr + bw + 14, Yv(xp)); ctx.stroke();
  if (pts < xp) { ctx.strokeStyle = COL.red; ctx.strokeRect(xr + 1.5, Yv(xp), bw - 3, (xp - pts) * k); }
  ctx.setLineDash([]);
  const bx = xr + bw + 22, c = d > 0 ? COL.white : COL.red;
  ctx.strokeStyle = c; ctx.lineWidth = 4;
  const y0 = Yv(hiV), y1 = lerp(Yv(hiV), Yv(loV), da);
  ctx.beginPath(); ctx.moveTo(bx - 10, y0); ctx.lineTo(bx, y0); ctx.lineTo(bx, y1); ctx.lineTo(bx - 10, y1); ctx.stroke();
  ctx.restore();
  const my = (Yv(hiV) + Yv(loV)) / 2;
  txt(signed(d), bx + 16, my - 14 + (1 - da) * 16, { size: 80, font: F.numW, align: 'left', color: c, alpha: da });
  txt(diffNote, bx + 18, my + 44, { size: 28, font: F.hd, weight: 700, align: 'left', color: COL.grey, alpha: da });
}

// 出手构成：标签在条上方，条宽 960
function mixRowV(t, t0, y, q, label, { dim = 1, hl = null, tHl = 99, hls = null } = {}) {
  const Q = GD.quarters[q];
  const e = easeOut(prog(t, t0, t0 + 0.7));
  if (e <= 0) return;
  if (hls) { hl = null; tHl = 99; for (const [k, ts] of hls) if (t >= ts) { hl = k; tHl = ts; } if (!hl) [hl, tHl] = hls[0]; }
  const x0 = 60, bw = 960, bh = 124, la = clamp((t - t0) / 0.3) * dim;
  runs([[label, { size: 44, font: F.hd, weight: 900 }], [EN ? `${Q.fga} shots` : `${Q.fga} 次出手`, { size: 28, font: F.hd, weight: 500, color: COL.grey }]], x0, y - 44, { align: 'left', alpha: la, gap: 18 });
  let x = x0;
  for (const k of ['three', 'mid', 'rim']) {
    const n = Q[k], w = bw * n / Q.fga * e;
    const [name, c] = KIND[k];
    const glow = hl === k ? easeOut(prog(t, tHl, tHl + 0.3)) : 0;
    ctx.save(); ctx.globalAlpha = dim * (hl && hl !== k ? lerp(1, 0.45, easeOut(prog(t, tHl, tHl + 0.3))) : 1);
    ctx.fillStyle = c; ctx.fillRect(x, y, Math.max(0, w - 4), bh);
    if (glow > 0) { ctx.strokeStyle = COL.white; ctx.lineWidth = 5; ctx.globalAlpha = glow * dim; ctx.strokeRect(x + 2, y - 4, w - 8, bh + 8); }
    ctx.restore();
    const ta = clamp((t - t0 - 0.5) / 0.3) * dim;
    if (w > 120) {
      txt(`${name} ${n}`, x + 16, y + 34, { size: 30, font: F.hd, weight: 900, align: 'left', alpha: ta });
      txt(`${Math.round(n / Q.fga * 100)}%`, x + w - 16, y + bh - 34, { size: 46, font: F.numW, align: 'right', alpha: ta });
    }
    x += w;
  }
}

    ctx.strokeRect(WIN.x + 1238 * s, py + 940 * s, 196 * s, 60 * s); ctx.restore();
  }
}
// 拆③ 持球流程：盖在面板上，四个节点竖排
function ov_flowV(t, ov) {
  const out = 1 - easeInOut(prog(t, ov.b - 0.35, ov.b));
  winVeil(easeOut(prog(t, ov.a, ov.a + 0.4)) * 0.62 * out);
  const e0 = easeOut(prog(t, ov.a, ov.a + 0.4)) * out;
  tag(L('这球怎么打', 'HOW TO PLAY IT'), 60, Y0 + 120, { size: 44, bg: COL.blue, align: 'left', alpha: e0 });
  const w = 860, h = 150, gap = 64, x = (VW - w) / 2, y0 = Y0 + 210;
  ov.nodes.forEach(([head, sub], i) => {
    const e = easeOut(prog(t, ov.keys[i], ov.keys[i] + 0.35)) * out;
    if (e <= 0) return;
    const y = y0 + i * (h + gap), last = i === ov.nodes.length - 1;
    ctx.save(); ctx.globalAlpha = e; ctx.translate((1 - e) * -24, 0);
    ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 22;
    ctx.fillStyle = 'rgba(35,31,32,0.95)'; ctx.fillRect(x, y, w, h); ctx.shadowBlur = 0;
    ctx.fillStyle = last ? COL.red : COL.blue; ctx.fillRect(x, y, 12, h);
    if (i > 0) {
      ctx.fillStyle = COL.white; const ax = VW / 2, ay = y - gap + 10;
      ctx.fillRect(ax - 3, ay, 6, gap - 34); ctx.beginPath(); ctx.moveTo(ax, y - 8); ctx.lineTo(ax - 14, y - 26); ctx.lineTo(ax + 14, y - 26); ctx.fill();
    }
    ctx.restore();
    txt(head, x + 44, y + 54, { size: 46, font: F.hd, weight: 900, align: 'left', alpha: e });
    txt(sub, x + 44, y + 110, { size: 30, font: F.hd, weight: 500, align: 'left', color: COL.grey, alpha: e });
  });
}

// 横版叠加层整体缩放后搬到窗口右上 / 左侧
const placed = (fn, x0, y0, s, tx, ty) => (t, ov) => { ctx.save(); ctx.translate(tx - x0 * s, ty - y0 * s); ctx.scale(s, s); fn(t, ov); ctx.restore(); };
const OVV = {
  score: placed(ov_score, 1500, 56, 0.95, VW - 40 - 370 * 0.95, Y0 + 36),
  run: placed(ov_run, 1520, 70, 0.95, VW - 40 - 350 * 0.95, Y0 + 36),
  fpts: placed(ov_fpts, 1340, 70, 0.95, VW - 40 - 530 * 0.95, Y0 + 36),
  shotcard: placed(ov_shotcard, 1450, 60, 0.95, VW - 40 - 420 * 0.95, Y0 + 36),
  chapter: placed(ov_chapter, 130, 250, 0.82, 60, Y0 + 230),
  huazi: ov_huazi, dual: ov_dualV, flow: ov_flowV,
};
const SHV = { board: shv_board, xbars: shv_xbars, shotmix: shv_shotmix, defdist: shv_defdist, mfull: shv_mfull, tl13: shv_tl13,
  summary: shv_summary, title: shv_title, end: shv_end, black: shv_black };

function bandsV() {
  ctx.fillStyle = COL.ink; ctx.fillRect(0, 0, VW, VH);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, VW, Y0); ctx.clip();
  ctx.fillStyle = COL.blue; ctx.beginPath(); ctx.arc(VW + 160, -560, 820, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.arc(VW + 160, -560, 842, Math.PI * 0.55, Math.PI * 0.92); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.arc(160, 420, 330, Math.PI * 1.05, Math.PI * 1.9); ctx.stroke();
  ctx.fillStyle = 'rgba(35,31,32,0.45)'; ctx.fillRect(0, 0, VW, Y0);
  ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.rect(0, WB, VW, VH - WB); ctx.clip();
  ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(VW / 2, VH + 150, 480, Math.PI, 2 * Math.PI); ctx.stroke();
  ctx.strokeRect(VW / 2 - 150, VH - 175, 300, 260);
  ctx.beginPath(); ctx.arc(VW / 2, VH - 175, 112, Math.PI, 2 * Math.PI); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = COL.red; ctx.fillRect(0, Y0 - 6, 200, 6);
}
function topBandV(t) {
  if (LOGO) {
    const lh = 76, lw = lh * LOGO.width / LOGO.height;
    ctx.save(); ctx.globalAlpha = 0.95; ctx.imageSmoothingQuality = 'high'; ctx.drawImage(LOGO, 44, 38, lw, lh); ctx.restore();
  }
  txt('NBA FINALS · GAME 4', VW - 44, 80, { size: 30, font: F.ko, weight: 'normal', align: 'right', color: COL.grey, spacing: 3 });
  if (EN) runs([['UP', { size: 54, font: F.hd, weight: 900 }], ['29', { size: 88, font: F.numW, color: COL.red }], ['· HOW DID THE SPURS BLOW IT?', { size: 54, font: F.hd, weight: 900 }]],
    VW / 2, 176, { gap: 12 });
  else runs([['领先', { size: 62, font: F.hd, weight: 900 }], ['29', { size: 96, font: F.numW, color: COL.red }], ['分，马刺是怎么输掉的？', { size: 62, font: F.hd, weight: 900 }]],
    VW / 2, 176, { gap: 8 });
  const c = (TL.chap || []).filter((x) => t >= x[0]).pop();
  if (c) {
    const e = easeOut(prog(t, c[0], c[0] + 0.45));
    ctx.save(); ctx.beginPath(); ctx.rect(0, 220, 60 + 1000 * e, 60); ctx.clip();
    slab(50, 227, 86, 46, COL.red);
    const tw = measure(c[2], { size: 32, font: F.hd, weight: 900 });
    slab(146, 227, tw + 50, 46, 'rgba(255,255,255,0.12)');
    ctx.restore();
    txt(c[1], 93, 252, { size: 40, font: F.numW, alpha: e });
    txt(c[2], 171, 250, { size: 32, font: F.hd, weight: 900, align: 'left', alpha: e });
  }
  txt(L('AI 合成配音 · 内部测试版', 'AI-generated narration'), VW / 2, VH - 44, { size: 22, font: F.hd, weight: 500, color: COL.grey, alpha: 0.55 });
}
function wrapLines(s, maxW, o) {
  const words = s.split(' '), lines = [];
  let cur = '';
  for (const w of words) {
    const nx = cur ? `${cur} ${w}` : w;
    if (cur && measure(nx, o) > maxW) { lines.push(cur); cur = w; } else cur = nx;
  }
  if (cur) lines.push(cur);
  return lines;
}
function subtitlesV(t) {
  for (const v of TL.vo) {
    for (const c of v.chunks) {
      const a = v.t + c.a, b = v.t + c.b + (c === v.chunks[v.chunks.length - 1] ? 0.2 : 0);
      if (t < a || t >= b) continue;
      txt(EN ? c.text : c.text.replace(/[：:]/g, ' '), VW / 2, SUB_Y, { size: 58, font: F.ui, stroke: 10, strokeColor: 'rgba(0,0,0,0.85)', shadow: 6 });
    }
  }
  for (const q of TL.quotes || []) {
    for (const c of q.chunks) {
      const a = q.t + c.a, b = q.t + c.b + 0.15;
      if (t < a || t >= b) continue;
      if (EN) {
        const o = { size: 50, font: F.ui };
        const ls = wrapLines(c.en, 980, o);
        ls.forEach((ln, i) => txt(ln, VW / 2, SUB_Y + (i - (ls.length - 1) / 2) * 62, { ...o, stroke: 9, strokeColor: 'rgba(0,0,0,0.85)', shadow: 6 }));
        continue;
      }
      txt(c.zh.replace(/[，。；]$/, ''), VW / 2, SUB_Y - 20, { size: 50, font: F.ui, stroke: 9, strokeColor: 'rgba(0,0,0,0.85)', shadow: 6 });
      const o = { size: 28, font: F.ui, weight: 500 };
      wrapLines(c.en, 980, o).forEach((ln, i) =>
        txt(ln, VW / 2, SUB_Y + 40 + i * 36, { ...o, color: COL.light, stroke: 6, strokeColor: 'rgba(0,0,0,0.8)', shadow: 4 }));
    }
  }
}
async function renderShotV(sh, t) {
  ctx.save();
  if (sh.sc !== 'end') { winRect(); ctx.clip(); }
  if (sh.lay === 'crop') await shv_crop(t, sh);
  else if (sh.lay === 'quote') await shv_quote(t, sh);
  else if (sh.lay === 'panel') await shv_panel(t, sh);
  else await SHV[sh.sc](t, sh);
  ctx.restore();
}
const offV = VT ? mk(VW, VH) : null, offVCtx = offV && offV.getContext('2d');
async function renderFrameV(t) {
  const f = Math.round(t * FPS);
  ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.globalCompositeOperation = 'source-over';
  bandsV();
  ctx.fillStyle = '#000'; ctx.fillRect(WIN.x, WIN.y, WIN.w, WIN.h);
  const shots = TL.shots;
  const k = shots.findIndex((s) => t >= s.a && t < s.b);
  const cur = shots[k];
  if (cur) {
    const prev = shots[k - 1];
    if (cur.xin && prev && t < cur.a + cur.xin) {
      const main = ctx;
      ctx = offVCtx; ctx.clearRect(0, 0, VW, VH);
      await renderShotV(prev, t);
      ctx = main;
      await renderShotV(cur, t);
      ctx.save(); ctx.globalAlpha = 1 - easeInOut((t - cur.a) / cur.xin); ctx.drawImage(offV, 0, 0); ctx.restore();
    } else {
      await renderShotV(cur, t);
    }
  }
  if (!cur || cur.sc !== 'end') {
    for (const ov of TL.ov || []) {
      if (t >= ov.a && t < ov.b) { ctx.save(); OVV[ov.type](t, ov); ctx.restore(); }
    }
    subtitlesV(t);
    topBandV(t);
  }
  // 比赛画面窗口里不叠颗粒：颗粒吃码率，平台二压后会变成一层雾
  const g = grain[f % 4], ox = -Math.floor(hash(f, 21) * 512), oy = -Math.floor(hash(f, 22) * 512);
  ctx.save();
  if (cur && cur.lay === 'crop') { ctx.beginPath(); ctx.rect(0, 0, VW, VH); ctx.rect(WIN.x, WIN.y, WIN.w, WIN.h); ctx.clip('evenodd'); }
  for (let x = ox; x < VW; x += 512) for (let y = oy; y < VH; y += 512) ctx.drawImage(g, x, y);
  ctx.restore();
}

const off = mk(W, H), offCtx = off.getContext('2d');
async function renderShot(sh, t) { ctx.save(); await SH[sh.sc](t, sh); ctx.restore(); }

window.renderFrame = VT ? renderFrameV : async (t) => {
  const f = Math.round(t * FPS);
  ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  for (const [name, [a, b]] of Object.entries(S)) {
    if (t >= a && t < b) { ctx.save(); await SCENES[name](t, f); ctx.restore(); break; }
  }
  const shots = TL.shots || [];
  const k = shots.findIndex((s) => t >= s.a && t < s.b);
  if (k >= 0) {
    const cur = shots[k], prev = shots[k - 1];
    if (cur.xin && prev && t < cur.a + cur.xin) {
      const main = ctx;
      ctx = offCtx; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
      await renderShot(prev, t);
      ctx = main;
      await renderShot(cur, t);
      ctx.save(); ctx.globalAlpha = 1 - easeInOut((t - cur.a) / cur.xin); ctx.drawImage(off, 0, 0); ctx.restore();
    } else {
      await renderShot(cur, t);
    }
  }
  for (const ov of TL.ov || []) {
    if (t >= ov.a && t < ov.b) { ctx.save(); OV[ov.type](t, ov); ctx.restore(); }
  }
  subtitles(t);
  if (LOGO) {
    const lh = 96, lw = lh * LOGO.width / LOGO.height;
    ctx.save(); ctx.globalAlpha = 0.92; ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 2;
    ctx.imageSmoothingQuality = 'high'; ctx.drawImage(LOGO, 56, 46, lw, lh); ctx.restore();
  }
  const g = grain[f % 4], ox = -Math.floor(hash(f, 21) * 512), oy = -Math.floor(hash(f, 22) * 512);
  for (let x = ox; x < W; x += 512) for (let y = oy; y < H; y += 512) ctx.drawImage(g, x, y);
};

window.ready = (async () => {
  TL = await (await fetch(`film_${MODE}${EN ? '_en' : ''}.json`)).json();
  T = TL.T || {}; S = TL.scenes || {};
  MAN = await (await fetch('clips/manifest.json')).json();
  if (VT) TRK = await (await fetch('track_vt.json')).json().catch(() => ({}));
  GD = await (await fetch('gfx_data.json')).json();
  window.DURATION = TL.duration;
  window.FPS = FPS;
  LOGO = await loadImg('../assets/logoman.png');
  const noto = new FontFace('NotoSansSC', 'url(../assets/fonts/NotoSansSC.ttf)', { weight: '100 900' });
  document.fonts.add(await noto.load());
  await Promise.all([
    ...[500, 700, 900].map((w) => document.fonts.load(`${w} 100px ${F.hd}`, '马刺尼克斯')),
    document.fonts.load(`bold 100px ${F.num}`), document.fonts.load(`bold 100px ${F.numW}`), document.fonts.load(`100px ${F.ko}`),
  ]);})();
</script>
